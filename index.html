<body>

    <!-- Health Check & Failure Detection Bar -->
    <div id="diagnostic-bar">
        <div class="status-pill">
            <div id="status-dot" class="status-dot"></div>
            <span id="diagnostic-text">Connecting to Supabase...</span>
        </div>
        <button id="retry-btn" class="hidden">Retry</button>
    </div>

    <div id="lobby-container">
        <h1>Xgames Lobby</h1>

        <!-- Setup / Join Section -->
        <div id="setup-section">
            <input type="text" id="username-input" placeholder="Enter Your Nickname" maxlength="15">
            <div class="button-group">
                <button id="create-room-btn" disabled>Create Room</button>
            </div>
            <div class="divider">OR</div>
            <div class="join-group">
                <input type="text" id="room-code-input" placeholder="Enter Room Code" maxlength="12">
                <button id="join-room-btn" disabled>Join Room</button>
            </div>
        </div>

        <!-- Active Room Section -->
        <div id="room-section" class="hidden">
            <div id="room-header">
                <h2>Room: <span id="current-room-code">------</span></h2>
                <button id="leave-room-btn" class="danger-btn">Leave</button>
            </div>

            <!-- Host Actions (Shown if player is host) -->
            <div id="host-controls-bar" class="hidden">
                <button id="lock-room-btn" class="btn-secondary">Lock Room</button>
            </div>

            <div id="player-list-container">
                <h3>
                    <span>Players</span>
                    <span id="player-count">0</span>
                </h3>
                <ul id="player-list"></ul>
            </div>

            <!-- Ready Up Action -->
            <div style="margin-bottom: 12px;">
                <button id="ready-btn" class="btn-success">Ready Up</button>
            </div>

            <div id="chat-box">
                <div id="messages"></div>
                <div class="chat-input-group">
                    <input type="text" id="message-input" placeholder="Type a message..." maxlength="300">
                    <button id="send-message-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">Notification</div>

    <script>
        const SUPABASE_URL = "https://vlrscrzwqjkresgvcygh.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_8p4urYQqT6YqV3YNkS9qyA_z19pF0mH";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const CODE_LENGTH = 6;
        const CODE_PREFIX = "XG-";
        const MAX_MESSAGE_LENGTH = 300;
        const DISCONNECT_GRACE_PERIOD_MS = 45000; // 45 seconds grace window for mobile app-switches

        let authUserId = null;
        let isHost = false;
        let isLocked = false;
        let isReady = false;
        let reconnectTimer = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const usernameInput = document.getElementById("username-input");
            const createRoomBtn = document.getElementById("create-room-btn");
            const roomCodeInput = document.getElementById("room-code-input");
            const joinRoomBtn = document.getElementById("join-room-btn");

            const setupSection = document.getElementById("setup-section");
            const roomSection = document.getElementById("room-section");
            const currentRoomCode = document.getElementById("current-room-code");
            const leaveRoomBtn = document.getElementById("leave-room-btn");
            const playerList = document.getElementById("player-list");
            const playerCount = document.getElementById("player-count");

            const hostControlsBar = document.getElementById("host-controls-bar");
            const lockRoomBtn = document.getElementById("lock-room-btn");
            const readyBtn = document.getElementById("ready-btn");

            const messageInput = document.getElementById("message-input");
            const sendMessageBtn = document.getElementById("send-message-btn");
            const messages = document.getElementById("messages");

            const diagnosticText = document.getElementById("diagnostic-text");
            const statusDot = document.getElementById("status-dot");
            const retryBtn = document.getElementById("retry-btn");
            const toast = document.getElementById("toast");

            let currentUser = "";
            let activeRoom = null;
            let roomChannel = null;

            // --- Failure Detection & Auth Startup ---
            async function initAuth() {
                updateHealthStatus("connecting", "Signing in anonymously...");
                try {
                    const { data: sessionData } = await supabaseClient.auth.getSession();
                    if (sessionData && sessionData.session) {
                        authUserId = sessionData.session.user.id;
                    } else {
                        const { data: signInData, error: signInError } = await supabaseClient.auth.signInAnonymously();
                        if (signInError) throw signInError;
                        authUserId = signInData.user.id;
                    }

                    updateHealthStatus("online", "Connected & Authenticated");
                    createRoomBtn.disabled = false;
                    joinRoomBtn.disabled = false;
                    retryBtn.classList.add("hidden");
                } catch (err) {
                    console.error("Auth Startup Error:", err);
                    updateHealthStatus("offline", "Auth Failed: Check Supabase settings");
                    retryBtn.classList.remove("hidden");
                    showToast("Authentication failed. Retry when ready.");
                }
            }

            retryBtn.addEventListener("click", () => {
                if (activeRoom) {
                    subscribeToRoom(activeRoom);
                } else {
                    initAuth();
                }
            });

            await initAuth();

            // --- Diagnostics & Toasts ---
            function updateHealthStatus(state, text) {
                diagnosticText.textContent = text;
                statusDot.className = "status-dot " + (state === "online" ? "online" : state === "offline" ? "offline" : "");
            }

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 3000);
            }

            function setBusy(busy) {
                createRoomBtn.disabled = busy;
                joinRoomBtn.disabled = busy;
            }

            function generateRoomCode() {
                const bytes = new Uint8Array(CODE_LENGTH);
                crypto.getRandomValues(bytes);
                let code = "";
                for (const b of bytes) code += CODE_CHARS[b % CODE_CHARS.length];
                return CODE_PREFIX + code;
            }

            function normalizeCode(raw) {
                let code = raw.trim().toUpperCase().replace(/\s+/g, "");
                if (code && !code.startsWith(CODE_PREFIX)) code = CODE_PREFIX + code;
                return code;
            }

            // --- Supabase Room Operations ---
            async function createRoomInSupabase() {
                for (let attempt = 0; attempt < 5; attempt++) {
                    const code = generateRoomCode();
                    const { error } = await supabaseClient
                        .from('rooms')
                        .insert([{ code: code, host_id: authUserId, is_locked: false }]);

                    if (!error) return code;
                    if (error.code !== "23505") {
                        console.error("Error creating room:", error);
                        return null;
                    }
                }
                return null;
            }

            async function fetchRoomDetails(code) {
                const { data, error } = await supabaseClient
                    .from('rooms')
                    .select('code, host_id, is_locked')
                    .eq('code', code)
                    .maybeSingle();

                if (error) {
                    console.error("Error checking room:", error);
                    return null;
                }
                return data;
            }

            // --- Realtime & Presence Synchronization ---
            function subscribeToRoom(code) {
                updateHealthStatus("connecting", `Joining ${code}...`);

                roomChannel = supabaseClient.channel(`room_${code}`, {
                    config: { presence: { key: authUserId } }
                });

                // Chat Messages
                roomChannel.on('broadcast', { event: 'message' }, (payload) => {
                    const data = payload && payload.payload;
                    if (!data) return;
                    displayMessage(
                        String(data.user || "Player").slice(0, 15),
                        String(data.text || "").slice(0, MAX_MESSAGE_LENGTH)
                    );
                });

                // Host Controls: Lock/Kick Broadcasts
                roomChannel.on('broadcast', { event: 'room_state' }, (payload) => {
                    const data = payload && payload.payload;
                    if (!data) return;
                    if (data.type === 'kick' && data.targetId === authUserId) {
                        showToast("You were kicked by the host.");
                        leaveRoom();
                    } else if (data.type === 'lock_update') {
                        isLocked = data.isLocked;
                        updateLockUI();
                    }
                });

                // Player List Sync
                roomChannel.on('presence', { event: 'sync' }, () => {
                    updatePlayerList(roomChannel.presenceState());
                });

                roomChannel.subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        updateHealthStatus("online", `In Room: ${code}`);
                        retryBtn.classList.add("hidden");
                        if (reconnectTimer) clearTimeout(reconnectTimer);

                        await roomChannel.track({
                            user: currentUser,
                            id: authUserId,
                            isHost: isHost,
                            isReady: isReady
                        });
                    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        updateHealthStatus("offline", "Reconnecting...");
                        retryBtn.classList.remove("hidden");
                        scheduleAutoReconnect(code);
                    }
                });
            }

            // Mobile Screen Lock & Disconnect Grace Window
            function scheduleAutoReconnect(code) {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(() => {
                    showToast("Connection lost. Returning to main menu.");
                    leaveRoom();
                }, DISCONNECT_GRACE_PERIOD_MS);
            }

            function updatePlayerList(presenceState) {
                playerList.innerHTML = "";
                let count = 0;

                Object.keys(presenceState).forEach(key => {
                    const playerData = presenceState[key][0];
                    if (playerData && playerData.user) {
                        count++;
                        const li = document.createElement("li");
                        li.className = "player-row";

                        const infoDiv = document.createElement("div");
                        infoDiv.className = "player-info";

                        const nameSpan = document.createElement("span");
                        const isMe = playerData.id === authUserId;
                        nameSpan.textContent = String(playerData.user).slice(0, 15) + (isMe ? " (You)" : "");
                        infoDiv.appendChild(nameSpan);

                        if (playerData.isHost) {
                            const hostBadge = document.createElement("span");
                            hostBadge.className = "badge badge-host";
                            hostBadge.textContent = "Host";
                            infoDiv.appendChild(hostBadge);
                        }

                        const readyBadge = document.createElement("span");
                        readyBadge.className = "badge " + (playerData.isReady ? "badge-ready" : "badge-not-ready");
                        readyBadge.textContent = playerData.isReady ? "Ready" : "Not Ready";
                        infoDiv.appendChild(readyBadge);

                        li.appendChild(infoDiv);

                        // If Host, render Kick button for other players
                        if (isHost && playerData.id !== authUserId) {
                            const kickBtn = document.createElement("button");
                            kickBtn.className = "kick-btn";
                            kickBtn.textContent = "Kick";
                            kickBtn.onclick = () => kickPlayer(playerData.id, playerData.user);
                            li.appendChild(kickBtn);
                        }

                        playerList.appendChild(li);
                    }
                });

                playerCount.textContent = count;
            }

            function updateLockUI() {
                lockRoomBtn.textContent = isLocked ? "Unlock Room" : "Lock Room";
                lockRoomBtn.className = isLocked ? "btn-success" : "btn-secondary";
            }

            async function kickPlayer(targetId, targetName) {
                if (!isHost || !roomChannel) return;
                await roomChannel.send({
                    type: 'broadcast',
                    event: 'room_state',
                    payload: { type: 'kick', targetId: targetId }
                });
                showToast(`Kicked ${targetName}`);
            }

            // --- UI Transitions ---
            function enterRoomUI(code) {
                activeRoom = code;
                currentRoomCode.textContent = code;
                setupSection.classList.add("hidden");
                roomSection.classList.remove("hidden");

                if (isHost) {
                    hostControlsBar.classList.remove("hidden");
                    updateLockUI();
                } else {
                    hostControlsBar.classList.add("hidden");
                }

                subscribeToRoom(code);
                addSystemMessage(`Welcome to room ${code}, ${currentUser}!`);
            }

            function displayMessage(author, text) {
                const msgElement = document.createElement("div");
                msgElement.classList.add("chat-message");

                const authorSpan = document.createElement("span");
                authorSpan.classList.add("author");
                authorSpan.textContent = author + ":";

                msgElement.appendChild(authorSpan);
                msgElement.appendChild(document.createTextNode(" " + text));
                messages.appendChild(msgElement);
                messages.scrollTop = messages.scrollHeight;
            }

            function addSystemMessage(text) {
                const msgElement = document.createElement("div");
                msgElement.classList.add("system-message");
                msgElement.textContent = text;
                messages.appendChild(msgElement);
                messages.scrollTop = messages.scrollHeight;
            }

            // --- Button Listeners ---
            createRoomBtn.addEventListener("click", async () => {
                const name = usernameInput.value.trim();
                if (!name) {
                    showToast("Please enter a nickname first.");
                    return;
                }

                setBusy(true);
                const newCode = await createRoomInSupabase();
                setBusy(false);

                if (newCode) {
                    currentUser = name;
                    isHost = true;
                    enterRoomUI(newCode);
                } else {
                    showToast("Failed to create room. Check database policies.");
                }
            });

            joinRoomBtn.addEventListener("click", async () => {
                const name = usernameInput.value.trim();
                const code = normalizeCode(roomCodeInput.value);

                if (!name) {
                    showToast("Please enter a nickname first.");
                    return;
                }
                if (!code || code === CODE_PREFIX) {
                    showToast("Please enter a valid room code.");
                    return;
                }

                setBusy(true);
                const roomData = await fetchRoomDetails(code);
                setBusy(false);

                if (roomData === null) {
                    showToast("Couldn't reach server. Retry connection.");
                    return;
                }
                if (!roomData) {
                    showToast("Room does not exist!");
                    return;
                }
                if (roomData.is_locked) {
                    showToast("This room is locked by the host.");
                    return;
                }

                currentUser = name;
                isHost = (roomData.host_id === authUserId);
                isLocked = roomData.is_locked;
                enterRoomUI(code);
            });

            lockRoomBtn.addEventListener("click", async () => {
                if (!isHost || !activeRoom) return;
                isLocked = !isLocked;

                // Update Database State
                await supabaseClient
                    .from('rooms')
                    .update({ is_locked: isLocked })
                    .eq('code', activeRoom);

                // Broadcast to Room
                await roomChannel.send({
                    type: 'broadcast',
                    event: 'room_state',
                    payload: { type: 'lock_update', isLocked: isLocked }
                });

                updateLockUI();
                showToast(isLocked ? "Room Locked" : "Room Unlocked");
            });

            readyBtn.addEventListener("click", async () => {
                if (!roomChannel) return;
                isReady = !isReady;
                readyBtn.textContent = isReady ? "Unready" : "Ready Up";
                readyBtn.className = isReady ? "btn-secondary" : "btn-success";

                await roomChannel.track({
                    user: currentUser,
                    id: authUserId,
                    isHost: isHost,
                    isReady: isReady
                });
            });

            async function leaveRoom() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                if (roomChannel) {
                    await supabaseClient.removeChannel(roomChannel);
                    roomChannel = null;
                }
                activeRoom = null;
                isHost = false;
                isReady = false;
                isLocked = false;
                readyBtn.textContent = "Ready Up";
                readyBtn.className = "btn-success";
                messages.innerHTML = "";
                playerList.innerHTML = "";
                roomSection.classList.add("hidden");
                setupSection.classList.remove("hidden");
                updateHealthStatus("online", "Connected & Authenticated");
            }

            leaveRoomBtn.addEventListener("click", leaveRoom);

            async function sendMessage() {
                const text = messageInput.value.trim().slice(0, MAX_MESSAGE_LENGTH);
                if (text && activeRoom && roomChannel) {
                    await roomChannel.send({
                        type: 'broadcast',
                        event: 'message',
                        payload: { user: currentUser, text: text }
                    });

                    displayMessage(currentUser, text);
                    messageInput.value = "";
                }
            }

            sendMessageBtn.addEventListener("click", sendMessage);
            messageInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") sendMessage();
            });
        });
    </script>
</body>
