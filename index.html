<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xgames Arcade - Jamaican Draughts Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen w-full items-center justify-between p-2 sm:p-4 overflow-hidden">

  <!-- Utility Header -->
  <header class="w-full max-w-md flex h-12 items-center justify-between border-b border-slate-800 px-3 bg-slate-900 rounded-lg">
    <button id="resetBtn" class="rounded-lg bg-red-900/40 px-3 py-1 text-xs font-semibold text-red-400 hover:bg-red-900/60 transition">Reset Match</button>
    <div class="flex items-center gap-2">
      <span id="turnDot" class="h-3 w-3 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="turnText" class="text-xs font-semibold text-slate-200">Player 1 (Light) Turn</span>
    </div>
    <div id="statusBadge" class="text-xs font-bold text-amber-400 hidden">FORCED JUMP!</div>
  </header>

  <!-- 1:1 Responsive Game Canvas Container -->
  <main class="w-full max-w-md flex flex-col items-center justify-center my-auto">
    <div class="relative aspect-square w-full max-h-[calc(100vh-12rem)] rounded-xl border-2 border-slate-700 bg-emerald-950 shadow-2xl overflow-hidden">
      <canvas id="draughtsCanvas" class="w-full h-full block cursor-pointer"></canvas>
    </div>
  </main>

  <!-- Footer Controls & Status -->
  <footer class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-lg p-3 text-center">
    <div class="flex justify-between text-xs text-slate-400 font-medium">
      <span id="p1Score">Light Pieces: 12</span>
      <span id="p2Score">Dark Pieces: 12</span>
    </div>
  </footer>

  <script>
    /**
     * Jamaican Draughts / Checkers Matrix Engine
     */
    class JamaicanDraughtsEngine {
      constructor() {
        this.board = Array(8).fill(null).map(() => Array(8).fill(0));
        this.activeTurn = 1; // 1 = Light (Bottom), 2 = Dark (Top)
        this.selectedSquare = null; // { row, col }
        this.validMoves = [];
        this.mustCapture = false;
        this.chainCapturePiece = null; // { row, col } if multi-jump required
        this.resetBoard();
      }

      resetBoard() {
        this.board = Array(8).fill(null).map(() => Array(8).fill(0));
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            if ((r + c) % 2 === 1) {
              if (r < 3) this.board[r][c] = 2; // Dark
              else if (r > 4) this.board[r][c] = 1; // Light
            }
          }
        }
        this.activeTurn = 1;
        this.selectedSquare = null;
        this.validMoves = [];
        this.chainCapturePiece = null;
        this.checkForForcedCaptures();
      }

      checkForForcedCaptures() {
        this.mustCapture = false;
        const allCaptures = this.getAllPossibleCaptures(this.activeTurn);
        if (allCaptures.length > 0) {
          this.mustCapture = true;
        }
      }

      isCurrentPlayerPiece(piece) {
        if (this.activeTurn === 1) return piece === 1 || piece === 3;
        if (this.activeTurn === 2) return piece === 2 || piece === 4;
        return false;
      }

      getValidMovesForPiece(r, c) {
        const piece = this.board[r][c];
        if (piece === 0 || !this.isCurrentPlayerPiece(piece)) return [];

        // If in a multi-jump chain, force player to keep jumping with that piece
        if (this.chainCapturePiece) {
          if (this.chainCapturePiece.row !== r || this.chainCapturePiece.col !== c) return [];
        }

        const captures = this.getPieceCaptures(r, c);
        if (this.mustCapture) {
          return captures;
        }

        return this.getPieceSimpleMoves(r, c);
      }

      getPieceSimpleMoves(r, c) {
        const piece = this.board[r][c];
        const isKing = piece === 3 || piece === 4;
        const moves = [];
        const directions = isKing
          ? [[-1,-1], [-1,1], [1,-1], [1,1]]
          : (this.activeTurn === 1 ? [[-1,-1], [-1,1]] : [[1,-1], [1,1]]);

        for (const [dr, dc] of directions) {
          if (isKing) {
            // Flying King Slide
            let nr = r + dr, nc = c + dc;
            while (this.isInBounds(nr, nc) && this.board[nr][nc] === 0) {
              moves.push({ toRow: nr, toCol: nc, captured: null });
              nr += dr; nc += dc;
            }
          } else {
            // Standard Man 1-step move
            const nr = r + dr, nc = c + dc;
            if (this.isInBounds(nr, nc) && this.board[nr][nc] === 0) {
              moves.push({ toRow: nr, toCol: nc, captured: null });
            }
          }
        }
        return moves;
      }

      getPieceCaptures(r, c) {
        const piece = this.board[r][c];
        const isKing = piece === 3 || piece === 4;
        const captures = [];
        const directions = [[-1,-1], [-1,1], [1,-1], [1,1]];

        for (const [dr, dc] of directions) {
          if (isKing) {
            // Flying King Jump
            let nr = r + dr, nc = c + dc;
            let foundOpponent = null;

            while (this.isInBounds(nr, nc)) {
              const cell = this.board[nr][nc];
              if (cell !== 0) {
                if (this.isOpponentPiece(piece, cell) && !foundOpponent) {
                  foundOpponent = { r: nr, c: nc };
                } else {
                  break; // Blocked
                }
              } else if (foundOpponent) {
                captures.push({ toRow: nr, toCol: nc, captured: foundOpponent });
              }
              nr += dr; nc += dc;
            }
          } else {
            // Standard Man Jump
            const midR = r + dr, midC = c + dc;
            const landR = r + (dr * 2), landC = c + (dc * 2);

            if (this.isInBounds(landR, landC) && this.board[landR][landC] === 0) {
              const midPiece = this.board[midR][midC];
              if (midPiece !== 0 && this.isOpponentPiece(piece, midPiece)) {
                captures.push({ toRow: landR, toCol: landC, captured: { r: midR, c: midC } });
              }
            }
          }
        }
        return captures;
      }

      makeMove(fromR, fromC, toR, toC) {
        const validMoves = this.getValidMovesForPiece(fromR, fromC);
        const chosenMove = validMoves.find(m => m.toRow === toR && m.toCol === toC);

        if (!chosenMove) return false;

        let piece = this.board[fromR][fromC];
        this.board[fromR][fromC] = 0;
        this.board[toR][toC] = piece;

        // Remove Captured Piece
        if (chosenMove.captured) {
          this.board[chosenMove.captured.r][chosenMove.captured.c] = 0;
        }

        // King Promotion
        if (piece === 1 && toR === 0) { this.board[toR][toC] = 3; piece = 3; }
        if (piece === 2 && toR === 7) { this.board[toR][toC] = 4; piece = 4; }

        // Check Chained Double Jumps
        if (chosenMove.captured) {
          const extraCaptures = this.getPieceCaptures(toR, toC);
          if (extraCaptures.length > 0) {
            this.chainCapturePiece = { row: toR, col: toC };
            this.selectedSquare = { row: toR, col: toC };
            this.validMoves = extraCaptures;
            this.mustCapture = true;
            return true;
          }
        }

        // End Turn
        this.chainCapturePiece = null;
        this.activeTurn = this.activeTurn === 1 ? 2 : 1;
        this.selectedSquare = null;
        this.validMoves = [];
        this.checkForForcedCaptures();
        return true;
      }

      isInBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
      
      isOpponentPiece(myPiece, otherPiece) {
        if (otherPiece === 0) return false;
        const p1 = [1, 3], p2 = [2, 4];
        if (p1.includes(myPiece)) return p2.includes(otherPiece);
        if (p2.includes(myPiece)) return p1.includes(otherPiece);
        return false;
      }

      getAllPossibleCaptures(player) {
        const captures = [];
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            if (this.isCurrentPlayerPiece(this.board[r][c])) {
              const pCap = this.getPieceCaptures(r, c);
              if (pCap.length > 0) captures.push({ row: r, col: c, moves: pCap });
            }
          }
        }
        return captures;
      }

      getPieceCounts() {
        let p1 = 0, p2 = 0;
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            if (this.board[r][c] === 1 || this.board[r][c] === 3) p1++;
            if (this.board[r][c] === 2 || this.board[r][c] === 4) p2++;
          }
        }
        return { p1, p2 };
      }
    }

    /**
     * Canvas UI Renderer & Input Controller
     */
    const engine = new JamaicanDraughtsEngine();
    const canvas = document.getElementById('draughtsCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      render();
    }

    function render() {
      const size = canvas.parentElement.getBoundingClientRect().width;
      const tileSize = size / 8;

      // 1. Draw Board Squares
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const isDark = (r + c) % 2 === 1;
          ctx.fillStyle = isDark ? '#064e3b' : '#ecfdf5'; // Deep emerald green & soft cream
          ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
        }
      }

      // 2. Highlight Selected Square
      if (engine.selectedSquare) {
        ctx.fillStyle = 'rgba(251, 191, 36, 0.4)'; // Amber glow
        ctx.fillRect(engine.selectedSquare.col * tileSize, engine.selectedSquare.row * tileSize, tileSize, tileSize);
      }

      // 3. Highlight Valid Target Moves
      for (const move of engine.validMoves) {
        ctx.fillStyle = 'rgba(16, 185, 129, 0.5)';
        ctx.beginPath();
        ctx.arc(move.toCol * tileSize + tileSize/2, move.toRow * tileSize + tileSize/2, tileSize * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // 4. Render Pieces
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const val = engine.board[r][c];
          if (val === 0) continue;

          const cx = c * tileSize + tileSize / 2;
          const cy = r * tileSize + tileSize / 2;
          const radius = tileSize * 0.38;

          // Outer Token Ring
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fillStyle = (val === 1 || val === 3) ? '#f8fafc' : '#0f172a'; // White/Slate vs Black/Slate
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;

          // Inner Bezel Style
          ctx.beginPath();
          ctx.arc(cx, cy, radius * 0.75, 0, Math.PI * 2);
          ctx.fillStyle = (val === 1 || val === 3) ? '#cbd5e1' : '#334155';
          ctx.fill();

          // Flying King Crown Rendering
          if (val === 3 || val === 4) {
            ctx.fillStyle = '#fbbf24'; // Gold Crown
            ctx.font = `${tileSize * 0.4}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👑', cx, cy);
          }
        }
      }

      // 5. Update Status UI Headers
      document.getElementById('turnText').innerText = engine.activeTurn === 1 ? "Player 1 (Light) Turn" : "Player 2 (Dark) Turn";
      document.getElementById('turnDot').className = `h-3 w-3 rounded-full animate-pulse ${engine.activeTurn === 1 ? 'bg-emerald-400' : 'bg-red-500'}`;
      
      const statusBadge = document.getElementById('statusBadge');
      if (engine.mustCapture) statusBadge.classList.remove('hidden');
      else statusBadge.classList.add('hidden');

      const counts = engine.getPieceCounts();
      document.getElementById('p1Score').innerText = `Light Pieces: ${counts.p1}`;
      document.getElementById('p2Score').innerText = `Dark Pieces: ${counts.p2}`;
    }

    // Touch & Mouse Input Listener
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const size = rect.width;
      const tileSize = size / 8;
      
      const col = Math.floor((e.clientX - rect.left) / tileSize);
      const row = Math.floor((e.clientY - rect.top) / tileSize);

      if (!engine.isInBounds(row, col)) return;

      const clickedPiece = engine.board[row][col];

      // If user clicks their own piece
      if (engine.isCurrentPlayerPiece(clickedPiece)) {
        if (!engine.chainCapturePiece) {
          engine.selectedSquare = { row, col };
          engine.validMoves = engine.getValidMovesForPiece(row, col);
        }
      } 
      // If user clicks a valid move destination
      else if (engine.selectedSquare) {
        const moved = engine.makeMove(engine.selectedSquare.row, engine.selectedSquare.col, row, col);
        if (!moved) {
          if (!engine.chainCapturePiece) {
            engine.selectedSquare = null;
            engine.validMoves = [];
          }
        }
      }

      render();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      engine.resetBoard();
      render();
    });

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);
  </script>
</body>
</html>
