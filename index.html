<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Xgames Arcade - Yard Dominoes (Six Love)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{margin:0;padding:8px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#07080c;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:8px}
.card{width:100%;max-width:460px;background:#141724;border:1px solid #23273a;border-radius:14px;padding:10px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.hidden{display:none!important}
.logo{font-weight:900;letter-spacing:.04em;color:#818cf8}.logo b{color:#f43f5e}
button{font:inherit;font-weight:700;font-size:13px;color:#fff;border:0;border-radius:9px;padding:10px 12px;cursor:pointer;background:#334155}
button.blue{background:#2563eb}button.green{background:#059669}button.purple{background:#4f46e5}button.gold{background:#a16207}button.red{background:#dc2626}
input{width:100%;font:inherit;font-size:14px;color:#fff;background:#0b0c12;border:1px solid #2a3045;border-radius:9px;padding:10px;outline:0;text-transform:none}
input:focus{border-color:#6366f1}
h2{margin:0;font-size:13px;color:#a5b4fc}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:#0b0c12;border:1px solid #23273a;border-radius:12px;padding:10px}
.pl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1e2433;font-size:14px}
.tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#f59e0b;color:#000}.tag.bot{background:#581c87;color:#e9d5ff}
.status{font-size:11px;color:#94a3b8}.status b{color:#fbbf24}
.score{display:flex;justify-content:space-between;align-items:center;background:#0b0c12;border:1px solid #23273a;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px}
.pill{display:inline-block;min-width:28px;text-align:center;background:#312e81;border-radius:99px;padding:3px 9px;margin-left:6px}
.mid{text-align:center;font-size:11px;color:#94a3b8}.mid i{display:block;font-style:normal;color:#fbbf24;font-size:10px}
.wrap{border:6px solid #5a3a1a;border-radius:16px;overflow:hidden;background:#120a04;position:relative}
canvas#board{display:block;width:100%;height:auto}
.shake{animation:shake .25s both}
@keyframes shake{20%,80%{transform:translate(-3px,-2px)}40%,60%{transform:translate(4px,3px)}50%{transform:translate(-4px,-3px)}}
#log{min-height:34px;padding:8px 10px;background:#0b0c12;border-radius:99px;font-size:13px;color:#e2e8f0;text-align:center}
.hand{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:42px}
.hand canvas{width:64px;height:36px;cursor:pointer;transition:transform .12s,opacity .12s}
.hand canvas.sel{transform:translateY(-5px)}.hand canvas.dim{opacity:.4}
.lbl{text-align:center;font-size:11px;color:#94a3b8;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.codeBig{font-size:28px;font-weight:900;letter-spacing:.12em;text-align:center;color:#fbbf24;padding:4px 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1e293b;border:1px solid #475569;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.voice-bar{display:flex;align-items:center;justify-content:space-between;background:#1e1b4b;padding:6px 12px;border-radius:8px;margin-bottom:6px;border:1px solid #312e81}
.voice-status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#a5b4fc}
.mic-dot{width:8px;height:8px;border-radius:50%;background:#64748b;transition:all .2s}
.mic-dot.active{background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
</style>
</head>
<body>

<div class="card row between">
  <div class="logo">XGAMES <b>ARCADE</b></div>
  <button class="blue" id="hubBtn">Main Arcade Hub</button>
</div>

<div class="card stack">
  <div class="panel row between status"><span id="syncLabel">Connecting...</span><b id="roomBadge">No room yet</b></div>

  <!-- LOBBY -->
  <div id="lobby" class="stack">
    <div id="homeBox" class="stack">
      <h2>Pick a name and a room</h2>
      <input id="nameIn" placeholder="Your nickname" maxlength="15" value="Dwayne">
      <div class="two">
        <button class="green" id="createBtn">+ Create room</button>
        <div class="row" style="gap:4px"><input id="codeIn" placeholder="XG-XXXXX" maxlength="10" style="text-transform:uppercase"><button id="joinBtn">Join</button></div>
      </div>
    </div>
    <div id="roomPanel" class="panel hidden">
      <div class="lbl">Room code</div>
      <div class="codeBig" id="codeBig">XG-XXXXX</div>
      <div class="two" style="margin:8px 0">
        <button class="blue" id="shareBtn">🔗 Share / Invite</button>
        <button class="purple" id="copyBtn">Copy code</button>
      </div>
      <button id="leaveBtn" style="width:100%;margin-bottom:8px">Leave room</button>
      <div class="row between" style="margin-bottom:4px"><b style="color:#fbbf24;font-size:13px">Players (<span id="pc">1</span>/4)</b><button class="purple" id="botBtn" style="padding:6px 10px;font-size:11px">+ Add bot</button></div>
      <div id="plist"></div>
      <button class="green" id="startBtn" style="width:100%;margin-top:10px">Start Yard Dominoes</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="stack hidden">
    <div class="voice-bar">
      <div class="voice-status">
        <div id="micDot" class="mic-dot"></div>
        <span>🎙️ Yard Voice</span>
      </div>
      <button id="micBtn" class="blue" style="padding:4px 10px;font-size:11px">Enable Mic</button>
    </div>
    <div class="score">
      <div>N/S<span class="pill" id="sNS">0</span></div>
      <div class="mid"><span id="handLbl">Hand 1</span><i>Six love</i></div>
      <div>E/W<span class="pill" id="sWE">0</span></div>
    </div>
    <div class="wrap" id="wrap"><canvas id="board" width="800" height="860"></canvas></div>
    <div id="log">Connecting to room...</div>
    <div class="panel">
      <div class="lbl" id="turnLbl">Your hand</div>
      <div class="hand" id="hand"></div>
      <div id="endBar" class="two hidden" style="margin-top:8px">
        <button class="gold" id="goL">Play left (<span id="lv">-</span>)</button>
        <button class="gold" id="goR">Play right (<span id="rv">-</span>)</button>
      </div>
      <button id="passBtn" class="hidden" style="width:100%;margin-top:8px;color:#fcd34d">Knock table (pass)</button>
      <button id="againBtn" class="green hidden" style="width:100%;margin-top:8px">Play another match</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ---------- SUPABASE & LIVEKIT CONFIG ---------- */
const SB_URL = 'https://vlrscrzwqjkresgvcygh.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZscnNjcnp3cWprcmVzZ3ZjeWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDExMjMsImV4cCI6MjEwNzg3NzEyM30.8ttvi0_BkIrPa7KQ7L4zcxBPHNz-e_gsbcF1Bep4b90';
const LIVEKIT_URL = 'wss://xgames-bjyx6237.livekit.cloud';

const sb = supabase.createClient(SB_URL, SB_KEY);
let roomSubscription = null, livekitRoom = null, roomCode = '', mySeatPos = 'S';
let micActive = false;

/* ---------- AUDIO ---------- */
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(f1, f2, d, type, vol, delay = 0) {
  try {
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.01, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const clack = () => tone(480, 90, .05, 'sine', .5);
const slam = () => { tone(180, 20, .22, 'triangle', 1); tone(650, 110, .06, 'square', .7); shake(); };
const knock = () => { tone(240, 60, .04, 'sine', .6); tone(240, 60, .04, 'sine', .6, .09); };
const fanfare = () => [261.63, 329.63, 392, 523.25, 659.25].forEach((f, i) => tone(f, 0, .3, 'sine', .35, i * .09));
function shake() {
  const w = $('wrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
  setTimeout(() => w.classList.remove('shake'), 260);
}

/* ---------- HELPERS ---------- */
const $ = id => document.getElementById(id);
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
const log = m => $('log').textContent = m;

/* ---------- STATE ---------- */
const NEXT = { N: 'W', W: 'S', S: 'E', E: 'N' };
let lobby = [], botN = 0, isHost = false;
let handNo = 1, sNS = 0, sWE = 0, lastWin = null, needD6 = true;
let players = [], turn = 'S', L = null, R = null, center = null, lb = [], rb = [], passes = 0, active = false, epoch = 0, matchOver = false;
const byPos = p => players.find(x => x.pos === p);

/* ---------- SUPABASE REALTIME SYNC ---------- */
async function syncRoomState() {
  if (!roomCode) return;
  const stateData = { handNo, sNS, sWE, lastWin, needD6, players, turn, L, R, center, lb, rb, passes, active, matchOver, lobby };
  await sb.from('game_rooms').upsert({ room_code: roomCode, state: stateData, updated_at: new Date() }, { onConflict: 'room_code' });
}

function listenToRoom() {
  if (roomSubscription) roomSubscription.unsubscribe();
  roomSubscription = sb.channel('room_' + roomCode)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_rooms', filter: 'room_code=eq.' + roomCode }, payload => {
      const st = payload.new.state;
      if (!st) return;
      handNo = st.handNo; sNS = st.sNS; sWE = st.sWE; lastWin = st.lastWin; needD6 = st.needD6;
      players = st.players || []; turn = st.turn; L = st.L; R = st.R; center = st.center;
      lb = st.lb || []; rb = st.rb || []; passes = st.passes; active = st.active; matchOver = st.matchOver;
      if (st.lobby) { lobby = st.lobby; renderLobby(); }
      refresh();
    }).subscribe();
}

/* ---------- LOBBY & SHARE ---------- */
$('createBtn').onclick = async () => {
  roomCode = 'XG-' + Math.random().toString(36).slice(2, 7).toUpperCase();
  isHost = true; mySeatPos = 'S';
  $('roomBadge').textContent = 'Room: ' + roomCode; $('codeBig').textContent = roomCode;
  lobby = [{ name: ($('nameIn').value.trim() || 'South') + ' (You)', isBot: false, pos: 'S' }];
  $('homeBox').classList.add('hidden'); $('roomPanel').classList.remove('hidden');
  renderLobby(); toast('Room ' + roomCode + ' created!');
  listenToRoom(); await syncRoomState();
};

$('joinBtn').onclick = async () => {
  const code = $('codeIn').value.trim().toUpperCase();
  if (!code) return toast('Enter a room code');
  joinRoomByCode(code);
};

async function joinRoomByCode(code) {
  const { data } = await sb.from('game_rooms').select('state').eq('room_code', code).single();
  if (!data) return toast('Room not found');
  roomCode = code; isHost = false;
  $('roomBadge').textContent = 'Room: ' + roomCode; $('codeBig').textContent = roomCode;
  const currentLobby = data.state.lobby || [];
  const positions = ['S', 'W', 'N', 'E'];
  const taken = currentLobby.map(p => p.pos);
  const freePos = positions.find(p => !taken.includes(p)) || 'W';
  mySeatPos = freePos;
  lobby = currentLobby;
  lobby.push({ name: ($('nameIn').value.trim() || 'Player') + ' (You)', isBot: false, pos: freePos });
  $('homeBox').classList.add('hidden'); $('roomPanel').classList.remove('hidden');
  renderLobby(); listenToRoom(); await syncRoomState();
}

$('copyBtn').onclick = () => {
  if (navigator.clipboard) navigator.clipboard.writeText(roomCode).then(() => toast('Code copied!'));
  else toast('Code: ' + roomCode);
};

$('shareBtn').onclick = () => {
  const joinUrl = window.location.origin + window.location.pathname + '?room=' + roomCode;
  if (navigator.share) {
    navigator.share({
      title: 'Xgames Yard Dominoes',
      text: 'Join my dominoes table! Room Code: ' + roomCode,
      url: joinUrl
    }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(joinUrl).then(() => toast('Invite link copied!'));
  } else {
    toast(joinUrl);
  }
};

$('leaveBtn').onclick = () => {
  lobby = []; roomCode = ''; $('roomBadge').textContent = 'No room yet';
  $('roomPanel').classList.add('hidden'); $('homeBox').classList.remove('hidden');
};

$('botBtn').onclick = () => {
  if (lobby.length >= 4) return toast('Room is full');
  const positions = ['S', 'W', 'N', 'E'];
  const taken = lobby.map(p => p.pos);
  const freePos = positions.find(p => !taken.includes(p));
  lobby.push({ name: 'XBot-' + (++botN), isBot: true, pos: freePos });
  renderLobby(); syncRoomState();
};

function renderLobby() {
  $('plist').innerHTML = '';
  lobby.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'pl';
    d.innerHTML = '<span></span><span><span class="tag' + (p.isBot ? ' bot' : '') + '">' + (p.isBot ? 'BOT' : 'PLAYER') + '</span>' +
      (isHost && i > 0 ? ' <button style="padding:2px 8px;background:none;color:#fb7185" data-i="' + i + '">×</button>' : '') + '</span>';
    d.firstChild.textContent = p.name;
    const x = d.querySelector('button'); if (x) x.onclick = () => { lobby.splice(i, 1); renderLobby(); syncRoomState(); };
    $('plist').appendChild(d);
  });
  $('pc').textContent = lobby.length;
}

$('startBtn').onclick = () => {
  const positions = ['S', 'W', 'N', 'E'];
  positions.forEach(pos => {
    if (!lobby.some(p => p.pos === pos)) lobby.push({ name: 'XBot-' + (++botN), isBot: true, pos });
  });
  newMatch();
};

/* ---------- INSTANT MIC TOGGLE ---------- */
$('micBtn').onclick = () => {
  if (AC.state === 'suspended') AC.resume();
  micActive = !micActive;
  
  // Instant UI update
  updateMicUI(micActive);

  // Background async LiveKit toggle
  setTimeout(async () => {
    try {
      if (micActive) {
        if (window.LivekitClient && !livekitRoom) {
          livekitRoom = new LivekitClient.Room();
          await livekitRoom.connect(LIVEKIT_URL, 'demo-token');
        }
        if (livekitRoom && livekitRoom.localParticipant) {
          await livekitRoom.localParticipant.setMicrophoneEnabled(true);
        }
      } else {
        if (livekitRoom && livekitRoom.localParticipant) {
          await livekitRoom.localParticipant.setMicrophoneEnabled(false);
        }
      }
    } catch (e) { console.log('Voice background sync'); }
  }, 10);
};

function updateMicUI(active) {
  const btn = $('micBtn'), dot = $('micDot');
  if (active) {
    btn.textContent = 'Mute Mic';
    btn.className = 'red';
    dot.classList.add('active');
    toast('Microphone ON');
  } else {
    btn.textContent = 'Enable Mic';
    btn.className = 'blue';
    dot.classList.remove('active');
    toast('Microphone OFF');
  }
}

/* Auto-check URL query for direct room links */
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const roomParam = params.get('room');
  if (roomParam) {
    $('codeIn').value = roomParam;
    joinRoomByCode(roomParam.toUpperCase());
  }
});

/* ---------- GAME CORE ---------- */
function fullSet() {
  const t = [];
  for (let i = 0; i <= 6; i++) for (let j = i; j <= 6; j++) t.push({ a: i, b: j, d: i === j });
  for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
  return t;
}

function newMatch() {
  $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
  sNS = 0; sWE = 0; handNo = 1; lastWin = null; matchOver = false;
  newHand();
}

function newHand() {
  epoch++;
  const deck = fullSet();
  players = ['S', 'W', 'N', 'E'].map((pos, i) => {
    const playerObj = lobby.find(l => l.pos === pos) || { name: 'XBot-' + i, isBot: true };
    return { name: playerObj.name, pos, hand: deck.slice(i * 7, i * 7 + 7), ai: playerObj.isBot };
  });
  center = null; L = R = null; lb = []; rb = []; passes = 0; active = true; $('againBtn').classList.add('hidden');
  needD6 = lastWin === null;
  if (needD6) {
    turn = players.find(p => p.hand.some(t => t.a === 6 && t.b === 6)).pos;
    log(byPos(turn).name + ' holds [6|6] and poses first.');
  } else {
    turn = lastWin; log('Hand ' + handNo + ': ' + byPos(turn).name + ' poses first.');
  }
  refresh(); syncRoomState(); maybeAi();
}

function isValid(t) {
  if (!center) return needD6 ? (t.a === 6 && t.b === 6) : true;
  return t.a === L || t.b === L || t.a === R || t.b === R;
}

function play(i, side) {
  const p = byPos(turn), t = p.hand.splice(i, 1)[0]; passes = 0;
  if (side === 'first') { center = { a: t.a, b: t.b, d: t.d }; L = t.a; R = t.b; }
  else if (side === 'left') { const o = t.a === L ? { a: t.a, b: t.b, d: t.d } : { a: t.b, b: t.a, d: t.d }; L = o.b; lb.push(o); }
  else { const o = t.a === R ? { a: t.a, b: t.b, d: t.d } : { a: t.b, b: t.a, d: t.d }; R = o.b; rb.push(o); }
  (t.d || !p.hand.length) ? slam() : clack();
  log('💥 ' + p.name + ' slammed [' + t.a + '|' + t.b + ']');
  if (!p.hand.length) return win(p.pos, p.name + ' went out!');
  next();
}

function pass() {
  const p = byPos(turn); passes++; knock(); log('✋ ' + p.name + ' knocked (passed).');
  if (passes >= 4) return blocked();
  next();
}

function next() { turn = NEXT[turn]; refresh(); syncRoomState(); maybeAi(); }

function maybeAi() {
  const e = epoch;
  if (active && byPos(turn).ai) setTimeout(() => { if (e === epoch && active) aiTurn(); }, 900);
}

function aiTurn() {
  const p = byPos(turn), opts = [];
  p.hand.forEach((t, i) => {
    if (!isValid(t)) return;
    if (!center) opts.push({ i, side: 'first', w: t.a + t.b });
    else {
      if (t.a === L || t.b === L) opts.push({ i, side: 'left', w: t.a + t.b });
      if (t.a === R || t.b === R) opts.push({ i, side: 'right', w: t.a + t.b });
    }
  });
  if (!opts.length) return pass();
  opts.sort((x, y) => y.w - x.w + (Math.random() - .5) * 3);
  play(opts[0].i, opts[0].side);
}

function blocked() {
  let ns = 0, we = 0;
  players.forEach(p => { const s = p.hand.reduce((a, t) => a + t.a + t.b, 0); (p.pos === 'N' || p.pos === 'S') ? ns += s : we += s; });
  if (ns < we) win('S', 'Blocked! N/S win (' + ns + ' vs ' + we + ' pips)');
  else if (we < ns) win('E', 'Blocked! E/W win (' + we + ' vs ' + ns + ' pips)');
  else {
    active = false; log('🤝 Blocked and tied. Replaying hand.'); const e = epoch;
    setTimeout(() => { if (e === epoch) { handNo++; newHand(); } }, 3000);
  }
}

function win(pos, why) {
  fanfare(); active = false; lastWin = pos;
  const ns = pos === 'N' || pos === 'S';
  if (ns) { if (sWE > 0 && sNS === 0) { toast('BREAK! Score reset to 0-0'); sWE = 0; } sNS++; }
  else { if (sNS > 0 && sWE === 0) { toast('BREAK! Score reset to 0-0'); sNS = 0; } sWE++; }
  log('🎉 ' + why);
  if (sNS >= 6 || sWE >= 6) {
    matchOver = true; log('🏆 Match over: Team ' + (sNS >= 6 ? 'N/S' : 'E/W') + ' wins six love!');
    refresh(); syncRoomState(); return;
  }
  refresh(); syncRoomState(); const e = epoch;
  setTimeout(() => { if (e === epoch) { handNo++; newHand(); } }, 3500);
}

/* ---------- HAND UI ---------- */
let selIdx = null;
function selectTile(i) {
  if (!active || turn !== mySeatPos) return toast('Not your turn');
  const t = byPos(mySeatPos).hand[i];
  if (!isValid(t)) return toast(!center && needD6 ? 'Hand 1 must start with [6|6]' : "That tile doesn't fit");
  if (!center) return play(i, 'first');
  const ml = t.a === L || t.b === L, mr = t.a === R || t.b === R;
  if (ml && mr) {
    selIdx = i; $('lv').textContent = L; $('rv').textContent = R; $('endBar').classList.remove('hidden');
    $('goL').onclick = () => { selIdx = null; play(i, 'left'); };
    $('goR').onclick = () => { selIdx = null; play(i, 'right'); };
    renderHand();
  } else play(i, ml ? 'left' : 'right');
}
$('passBtn').onclick = () => { if (active && turn === mySeatPos) pass(); };

function renderHand() {
  const box = $('hand'); box.innerHTML = '';
  const me = byPos(mySeatPos); if (!me) return;
  const mine = active && turn === mySeatPos;
  me.hand.forEach((t, i) => {
    const c = document.createElement('canvas'); c.width = 128; c.height = 72;
    const x = c.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0);
    drawTile(x, 32, 18, t.a, t.b, false, 1.4);
    if (mine && center && !isValid(t)) c.className = 'dim';
    if (selIdx === i) c.className = 'sel';
    c.onclick = () => selectTile(i);
    box.appendChild(c);
  });
  const canMove = me.hand.some(isValid);
  $('passBtn').classList.toggle('hidden', !(mine && center && !canMove));
  if (!(mine && selIdx !== null)) $('endBar').classList.add('hidden');
}

/* ---------- CANVAS ENGINE ---------- */
const cv = $('board'), ctx = cv.getContext('2d');
const W = 400, H = 430, PITCH = 36, MARGIN = 44, CORNER = 20, CY = 218;
const PIPS = { 0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function pips(c, x, y, w, h, n, s) {
  c.fillStyle = '#111827';
  PIPS[n].forEach(i => {
    c.beginPath(); c.arc(x + w * (0.2 + 0.3 * (i % 3)), y + h * (0.2 + 0.3 * ((i / 3) | 0)), 1.9 * s, 0, 7); c.fill();
  });
}
function drawTile(c, x, y, a, b, vert, s) {
  s = s || 1; const w = 40 * s, h = 20 * s, dbl = a === b;
  c.save(); c.translate(x, y); if (vert) c.rotate(Math.PI / 2);
  c.shadowColor = 'rgba(0,0,0,.65)'; c.shadowBlur = 4 * s; c.shadowOffsetY = 2 * s;
  rr(c, -w / 2, -h / 2, w, h, 4 * s); c.fillStyle = dbl ? '#fde68a' : '#f5f1e6'; c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = 1; c.strokeStyle = dbl ? '#ca8a04' : '#a8a291'; c.stroke();
  c.strokeStyle = '#8b8574'; c.beginPath(); c.moveTo(0, -h / 2 + 3 * s); c.lineTo(0, h / 2 - 3 * s); c.stroke();
  pips(c, -w / 2, -h / 2, w / 2, h, a, s); pips(c, 0, -h / 2, w / 2, h, b, s);
  c.restore();
}
function layout(tiles, startX, y0, dir, rowDir) {
  let x = startX, y = y0; const out = [];
  const limitR = W - MARGIN - CORNER, limitL = MARGIN + CORNER;
  tiles.forEach(t => {
    const ew = t.d ? 20 : 40;
    const fits = dir > 0 ? x + ew <= limitR : x - ew >= limitL;
    if (fits) {
      out.push({ t, cx: x + dir * ew / 2, cy: y, dir, corner: false });
      x += dir * ew;
    } else {
      out.push({ t, cx: x + dir * CORNER / 2, cy: y + rowDir * PITCH / 2, rowDir, corner: true });
      y += rowDir * PITCH; dir = -dir;
    }
  });
  return { out, x, y, dir };
}
function drawLinked(o) {
  if (o.corner) {
    const top = o.rowDir > 0 ? o.t.a : o.t.b, bottom = o.rowDir > 0 ? o.t.b : o.t.a;
    drawTile(ctx, o.cx, o.cy, top, bottom, true, 1);
  } else {
    drawTile(ctx, o.cx, o.cy, o.dir > 0 ? o.t.a : o.t.b, o.dir > 0 ? o.t.b : o.t.a, o.t.d, 1);
  }
}
function endTag(x, y, dir, txt) {
  const w = 26, h = 13;
  let cx = x + dir * (w / 2 + 3);
  cx = Math.min(W - MARGIN - w / 2, Math.max(MARGIN + w / 2, cx));
  rr(ctx, cx - w / 2, y - h / 2, w, h, 6);
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = '#7c5a1c'; ctx.stroke();
  ctx.fillStyle = '#fcd34d'; ctx.font = '700 8px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, cx, y + .5);
}
const SEATS = {
  N: { x: 145, y: 6, w: 110, h: 32, horiz: true },
  S: { x: 145, y: 392, w: 110, h: 32, horiz: true },
  W: { x: 3, y: 183, w: 38, h: 70, horiz: false },
  E: { x: 359, y: 183, w: 38, h: 70, horiz: false }
};
function drawSeat(pos) {
  const p = byPos(pos); if (!p) return;
  const s = SEATS[pos], act = pos === turn && active;
  const nm = p.name.replace(' (You)', ''), n = p.hand ? p.hand.length : 0;
  rr(ctx, s.x, s.y, s.w, s.h, 9);
  ctx.fillStyle = act ? '#4a3510' : 'rgba(0,0,0,.55)'; ctx.fill();
  ctx.lineWidth = act ? 2 : 1; ctx.strokeStyle = act ? '#facc15' : '#3a2a14'; ctx.stroke();
  const ax = s.horiz ? s.x + 17 : s.x + s.w / 2, ay = s.horiz ? s.y + s.h / 2 : s.y + 17;
  ctx.beginPath(); ctx.arc(ax, ay, 11, 0, 7); ctx.fillStyle = p.ai ? '#581c87' : '#b45309'; ctx.fill();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = '800 11px system-ui'; ctx.fillText(nm.charAt(0).toUpperCase(), ax, ay + .5);
  const count = n + (n === 1 ? ' tile' : ' tiles');
  if (s.horiz) {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.font = '700 10px system-ui'; ctx.fillText(nm.slice(0, 9) + (pos === mySeatPos ? ' ★' : ''), s.x + 33, s.y + 12);
    ctx.fillStyle = '#fbbf24'; ctx.font = '600 9px system-ui'; ctx.fillText(count, s.x + 33, s.y + 24);
  } else {
    ctx.fillStyle = '#fff'; ctx.font = '700 8px system-ui'; ctx.fillText(nm.slice(0, 6), s.x + s.w / 2, s.y + 38);
    ctx.fillStyle = '#fbbf24'; ctx.font = '600 9px system-ui'; ctx.fillText(count, s.x + s.w / 2, s.y + 54);
  }
}
function drawBoard() {
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1d1108'); g.addColorStop(1, '#0d0703');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ['N', 'W', 'E', 'S'].forEach(drawSeat);
  if (!center) {
    ctx.fillStyle = '#fcd34d'; ctx.font = '700 13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(needD6 ? 'Pose [6|6] to start the hand' : 'Table empty. Pose any tile', W / 2, CY + 4); return;
  }
  const cx = W / 2, cy = CY, cw = center.d ? 20 : 40;
  const lay = layout(lb, cx - cw / 2, cy, -1, -1), ray = layout(rb, cx + cw / 2, cy, 1, 1);
  drawTile(ctx, cx, cy, center.a, center.b, center.d, 1);
  lay.out.forEach(drawLinked);
  ray.out.forEach(drawLinked);
  endTag(lay.x, lay.y, lay.dir, 'L ' + L);
  endTag(ray.x, ray.y, ray.dir, 'R ' + R);
}

/* ---------- REFRESH ---------- */
function refresh() {
  $('syncLabel').textContent = roomCode ? 'Online Sync Active' : 'Offline Practice';
  $('sNS').textContent = sNS; $('sWE').textContent = sWE; $('handLbl').textContent = 'Hand ' + handNo;
  $('turnLbl').textContent = matchOver ? 'Match over' : (turn === mySeatPos && active ? 'Your turn' : 'Turn: ' + (byPos(turn) ? byPos(turn).name : ''));
  selIdx = null; drawBoard(); renderHand();
  $('againBtn').classList.toggle('hidden', !matchOver);
}

$('hubBtn').onclick = () => { epoch++; active = false; $('game').classList.add('hidden'); $('lobby').classList.remove('hidden'); };
$('againBtn').onclick = newMatch;
</script>
