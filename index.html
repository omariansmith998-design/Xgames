<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xgames Lobby</title>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f12;
            color: #f0f0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        #lobby-container {
            background: #18181c;
            border: 1px solid #2a2a32;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 380px;
        }

        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
            color: #6366f1;
        }

        #setup-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .divider {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin: 4px 0;
        }

        .join-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 16px stops iPhones from zooming in when you tap a field */
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #2e2e38;
            background: #111115;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .danger-btn {
            background: #dc2626;
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }

        .danger-btn:hover {
            background: #b91c1c;
        }

        .hidden {
            display: none !important;
        }

        #room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a32;
        }

        #room-header h2 {
            font-size: 16px;
        }

        #player-list-container {
            margin-bottom: 15px;
            background: #111115;
            padding: 10px;
            border-radius: 6px;
        }

        #player-list-container h3 {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        #player-list {
            list-style: none;
            font-size: 14px;
        }

        #player-list li {
            padding: 4px 0;
            color: #10b981;
        }

        #chat-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #messages {
            background: #111115;
            height: 180px;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }

        .chat-message {
            word-break: break-word;
        }

        .chat-message .author {
            font-weight: bold;
            color: #6366f1;
        }

        .system-message {
            color: #888;
            font-style: italic;
            word-break: break-word;
        }

        .chat-input-group {
            display: flex;
            gap: 8px;
        }

        .chat-input-group input {
            flex: 1;
        }

        .chat-input-group button {
            width: auto;
            padding: 0 16px;
        }
    </style>
</head>
<body>
    <div id="lobby-container">
        <h1>Xgames Lobby</h1>

        <!-- Setup / Join Section -->
        <div id="setup-section">
            <input type="text" id="username-input" placeholder="Enter Your Nickname" maxlength="15">
            <div class="button-group">
                <button id="create-room-btn">Create Room</button>
            </div>
            <div class="divider">OR</div>
            <div class="join-group">
                <input type="text" id="room-code-input" placeholder="Enter Room Code" maxlength="12">
                <button id="join-room-btn">Join Room</button>
            </div>
        </div>

        <!-- Active Room Section -->
        <div id="room-section" class="hidden">
            <div id="room-header">
                <h2>Room: <span id="current-room-code">------</span></h2>
                <button id="leave-room-btn" class="danger-btn">Leave</button>
            </div>

            <div id="player-list-container">
                <h3>Players</h3>
                <ul id="player-list"></ul>
            </div>

            <div id="chat-box">
                <div id="messages"></div>
                <div class="chat-input-group">
                    <input type="text" id="message-input" placeholder="Type a message..." maxlength="300">
                    <button id="send-message-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE CREDENTIALS
        // The publishable key is safe in the browser ONLY because Row Level Security
        // is on for the rooms table. Never put a "sb_secret_" key in this file.
        const SUPABASE_URL = "https://vlrscrzwqjkresgvcygh.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_8p4urYQqT6YqV3YNkS9qyA_z19pF0mH";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Room code settings: no 0/O/1/I so codes are easy to read and type
        const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const CODE_LENGTH = 6;
        const CODE_PREFIX = "XG-";
        const MAX_MESSAGE_LENGTH = 300;

        // The player's real, server-issued ID (set after anonymous sign-in).
        // It survives refreshes because Supabase keeps the session in this browser.
        let userId = null;
        let lastCreateError = null; // shown on screen so problems are easy to diagnose from a phone

        async function ensureSignedIn() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) return session.user.id;

            const { data, error } = await supabaseClient.auth.signInAnonymously();
            if (error) throw error;
            return data.user.id;
        }

        // Remember the nickname on this device (storage can be blocked, so never let it crash)
        function loadNickname() {
            try { return localStorage.getItem("xg_nickname") || ""; } catch (e) { return ""; }
        }
        function saveNickname(name) {
            try { localStorage.setItem("xg_nickname", name); } catch (e) { /* ignore */ }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const usernameInput = document.getElementById("username-input");
            const createRoomBtn = document.getElementById("create-room-btn");
            const roomCodeInput = document.getElementById("room-code-input");
            const joinRoomBtn = document.getElementById("join-room-btn");

            const setupSection = document.getElementById("setup-section");
            const roomSection = document.getElementById("room-section");
            const currentRoomCode = document.getElementById("current-room-code");
            const leaveRoomBtn = document.getElementById("leave-room-btn");
            const playerList = document.getElementById("player-list");

            const messageInput = document.getElementById("message-input");
            const sendMessageBtn = document.getElementById("send-message-btn");
            const messages = document.getElementById("messages");

            let currentUser = "";
            let activeRoom = null;
            let roomChannel = null;

            // ---------- helpers ----------

            function setBusy(busy) {
                createRoomBtn.disabled = busy;
                joinRoomBtn.disabled = busy;
            }

            // Secure random room code, e.g. XG-K7X9M2
            function generateRoomCode() {
                const bytes = new Uint8Array(CODE_LENGTH);
                crypto.getRandomValues(bytes);
                let code = "";
                for (const b of bytes) code += CODE_CHARS[b % CODE_CHARS.length];
                return CODE_PREFIX + code;
            }

            // Lets people type "K7X9M2" or "xg-k7x9m2"
            function normalizeCode(raw) {
                let code = raw.trim().toUpperCase().replace(/\s+/g, "");
                if (code && !code.startsWith(CODE_PREFIX)) code = CODE_PREFIX + code;
                return code;
            }

            // Returns the new room code, or null if it failed
            async function createRoomInSupabase() {
                for (let attempt = 0; attempt < 5; attempt++) {
                    const code = generateRoomCode();
                    const { error } = await supabaseClient
                        .from('rooms')
                        .insert([{ code: code }]);

                    if (!error) return code;

                    // 23505 = that code already exists, so try a different one
                    if (error.code !== "23505") {
                        console.error("Error creating room:", error);
                        lastCreateError = error;
                        return null;
                    }
                }
                return null;
            }

            // Returns true / false, or null if the lookup itself failed (network, etc.)
            async function checkRoomExists(code) {
                const { data, error } = await supabaseClient
                    .from('rooms')
                    .select('code')
                    .eq('code', code)
                    .maybeSingle();

                if (error) {
                    console.error("Error checking room:", error);
                    return null;
                }
                return !!data;
            }

            // ---------- realtime ----------

            function subscribeToRoom(code) {
                roomChannel = supabaseClient.channel(`room_${code}`, {
                    config: { presence: { key: userId } }
                });

                // Live chat from other players
                roomChannel.on('broadcast', { event: 'message' }, (payload) => {
                    const data = payload && payload.payload;
                    if (!data) return;
                    displayMessage(
                        String(data.user || "Player").slice(0, 15),
                        String(data.text || "").slice(0, MAX_MESSAGE_LENGTH)
                    );
                });

                // Players currently in the room
                roomChannel.on('presence', { event: 'sync' }, () => {
                    updatePlayerList(roomChannel.presenceState());
                });

                roomChannel.subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await roomChannel.track({ user: currentUser });
                    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        addSystemMessage("Connection problem. Try leaving and rejoining.");
                    }
                });
            }

            function updatePlayerList(presenceState) {
                playerList.innerHTML = "";
                Object.keys(presenceState).forEach(key => {
                    const user = presenceState[key][0] && presenceState[key][0].user;
                    if (user) {
                        const li = document.createElement("li");
                        const isMe = key === userId;
                        li.textContent = `● ${String(user).slice(0, 15)}${isMe ? " (You)" : ""}`;
                        playerList.appendChild(li);
                    }
                });
            }

            // ---------- UI ----------

            function enterRoomUI(code) {
                activeRoom = code;
                saveNickname(currentUser);
                currentRoomCode.textContent = code;
                setupSection.classList.add("hidden");
                roomSection.classList.remove("hidden");
                subscribeToRoom(code);
                addSystemMessage(`Welcome to room ${code}, ${currentUser}!`);
            }

            // textContent only (never innerHTML), so nobody can inject HTML or scripts via chat
            function displayMessage(author, text) {
                const msgElement = document.createElement("div");
                msgElement.classList.add("chat-message");

                const authorSpan = document.createElement("span");
                authorSpan.classList.add("author");
                authorSpan.textContent = author + ":";

                msgElement.appendChild(authorSpan);
                msgElement.appendChild(document.createTextNode(" " + text));
                messages.appendChild(msgElement);
                messages.scrollTop = messages.scrollHeight;
            }

            function addSystemMessage(text) {
                const msgElement = document.createElement("div");
                msgElement.classList.add("system-message");
                msgElement.textContent = text;
                messages.appendChild(msgElement);
                messages.scrollTop = messages.scrollHeight;
            }

            // ---------- actions ----------

            createRoomBtn.addEventListener("click", async () => {
                const name = usernameInput.value.trim();
                if (!name) {
                    alert("Please enter a nickname first.");
                    return;
                }

                setBusy(true);
                const newCode = await createRoomInSupabase();
                setBusy(false);

                if (newCode) {
                    currentUser = name;
                    enterRoomUI(newCode);
                } else {
                    const detail = lastCreateError
                        ? `${lastCreateError.code || ""} ${lastCreateError.message || ""}`.trim()
                        : "unknown error";
                    alert("Failed to create room.\n\n" + detail);
                }
            });

            joinRoomBtn.addEventListener("click", async () => {
                const name = usernameInput.value.trim();
                const code = normalizeCode(roomCodeInput.value);

                if (!name) {
                    alert("Please enter a nickname first.");
                    return;
                }
                if (!code || code === CODE_PREFIX) {
                    alert("Please enter a valid room code.");
                    return;
                }

                setBusy(true);
                const exists = await checkRoomExists(code);
                setBusy(false);

                if (exists === null) {
                    alert("Couldn't reach the server. Check your connection and try again.");
                    return;
                }
                if (!exists) {
                    alert("Room does not exist! Please check the code.");
                    return;
                }

                currentUser = name;
                enterRoomUI(code);
            });

            leaveRoomBtn.addEventListener("click", async () => {
                if (roomChannel) {
                    // removeChannel fully cleans up, so rejoining doesn't stack duplicate channels
                    await supabaseClient.removeChannel(roomChannel);
                    roomChannel = null;
                }
                activeRoom = null;
                messages.innerHTML = "";
                playerList.innerHTML = "";
                roomSection.classList.add("hidden");
                setupSection.classList.remove("hidden");
            });

            async function sendMessage() {
                const text = messageInput.value.trim().slice(0, MAX_MESSAGE_LENGTH);
                if (text && activeRoom && roomChannel) {
                    await roomChannel.send({
                        type: 'broadcast',
                        event: 'message',
                        payload: { user: currentUser, text: text }
                    });

                    displayMessage(currentUser, text);
                    messageInput.value = "";
                }
            }

            sendMessageBtn.addEventListener("click", sendMessage);
            messageInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") sendMessage();
            });

            // ---------- startup ----------
            usernameInput.value = loadNickname();
            setBusy(true); // locked until sign-in finishes

            ensureSignedIn()
                .then((id) => {
                    userId = id;
                    setBusy(false);
                })
                .catch((err) => {
                    console.error("Sign-in failed:", err);
                    alert("Couldn't sign you in. If you're the developer, check that anonymous sign-ins are turned on in Supabase.");
                });
        });
    </script>
</body>
</html>
