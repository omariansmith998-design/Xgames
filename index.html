<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{margin:0;padding:8px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#07080c;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:8px}
.card{width:100%;max-width:460px;background:#141724;border:1px solid #23273a;border-radius:14px;padding:10px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.hidden{display:none!important}
.logo{font-weight:900;letter-spacing:.04em;color:#818cf8}.logo b{color:#f43f5e}
button{font:inherit;font-weight:700;font-size:13px;color:#fff;border:0;border-radius:99px;padding:8px 12px;cursor:pointer;background:#334155}
button:disabled{opacity:.5}
button.blue{background:#2563eb}button.green{background:#059669}button.purple{background:#4f46e5}button.gold{background:#a16207}button.red{background:#dc2626}
input{width:100%;font:inherit;font-size:14px;color:#fff;background:#0b0c12;border:1px solid #2a3045;border-radius:99px;padding:10px 14px;outline:0;text-transform:none}
input:focus{border-color:#6366f1}
h2{margin:0;font-size:13px;color:#a5b4fc}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:#0b0c12;border:1px solid #23273a;border-radius:12px;padding:10px}
.pl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1e2433;font-size:14px}
.tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#f59e0b;color:#000}.tag.bot{background:#581c87;color:#e9d5ff}.tag.host{background:#0284c7;color:#fff}.tag.you{background:#059669;color:#fff}
.status{font-size:11px;color:#94a3b8}.status b{color:#fbbf24}
.score{display:flex;justify-content:space-between;align-items:center;background:#0b0c12;border:1px solid #23273a;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px}
.pill{display:inline-block;min-width:28px;text-align:center;background:#312e81;border-radius:99px;padding:3px 9px;margin-left:6px}
.mid{text-align:center;font-size:11px;color:#94a3b8}.mid i{display:block;font-style:normal;color:#fbbf24;font-size:10px}

/* TABLE CANVAS CONTAINER */
.wrap{border:5px solid #3d2314;border-radius:16px;overflow:hidden;background:#155e2b;position:relative}
canvas#board{display:block;width:100%;height:auto}
.shake{animation:shake .25s both}
@keyframes shake{20%,80%{transform:translate(-3px,-2px)}40%,60%{transform:translate(4px,3px)}50%{transform:translate(-4px,-3px)}}
#log{min-height:34px;padding:8px 10px;background:#0b0c12;border-radius:99px;font-size:12px;color:#e2e8f0;text-align:center;display:flex;align-items:center;justify-content:center}
.hand{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:44px;padding:4px 0}
.hand canvas{width:60px;height:34px;cursor:pointer;transition:transform .12s,opacity .12s}
.hand canvas.sel{transform:translateY(-6px)}
.hand canvas.dim{opacity:.4}
.lbl{text-align:center;font-size:11px;color:#94a3b8;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.codeBig{font-size:28px;font-weight:900;letter-spacing:.12em;text-align:center;color:#fbbf24;padding:4px 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1e293b;border:1px solid #475569;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.voice-bar{display:flex;align-items:center;justify-content:space-between;background:#1e1b4b;padding:6px 12px;border-radius:8px;margin-bottom:6px;border:1px solid #312e81}
.voice-status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#a5b4fc}
.mic-dot{width:8px;height:8px;border-radius:50%;background:#64748b;transition:all .2s}
.mic-dot.active{background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.profile-card{background:#11131f;border:1px solid #282e42;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* OUTSIDE PLAYER SEAT BADGES (CLEAN TOP BAR) */
.seat-grid-outside {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  background: #0b0c12;
  border: 1px solid #23273a;
  border-radius: 10px;
  padding: 6px;
  margin-bottom: 6px;
}
.seat-card-out {
  background: #141724;
  border: 1px solid #282e42;

  padding: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-align: center;
}
.seat-card-out.active {
  border-color: #facc15;
  background: #3a2a14;
}
.seat-card-out .p-name {
  font-size: 10px;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.seat-card-out .p-tiles {
  font-size: 9px;
  font-weight: 700;
  color: #fbbf24;
}
.seat-card-out .p-avatar {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #b45309;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 9px;
  color: #fff;
}
.seat-card-out .p-avatar.bot { background: #581c87; }
.seat-mute-btn {
  background: #334155;
  border: 0;
  color: #fff;
  border-radius: 4px;
  padding: 1px 4px;
  font-size: 8px;
  cursor: pointer;
  margin-top: 2px;
}
.seat-mute-btn.muted { background: #dc2626; }
</style>

<body>

<div class="card row between">
  <div class="logo">XGAMES <b>ARCADE</b></div>
  <button class="blue" id="hubBtn">Main Arcade Hub</button>
</div>

<div class="card stack">
  <div class="panel row between status"><span id="syncLabel">Offline Practice</span><b id="roomBadge">No room yet</b></div>

  <!-- PROFILE SETUP -->
  <div id="profileBox" class="profile-card stack hidden">
    <h2>Set Up Your Player Profile</h2>
    <input id="profileNameIn" placeholder="Enter nickname (e.g. Omarian, Tav, Louis)" maxlength="15">
    <button class="green" id="saveProfileBtn">Save Profile & Continue</button>

  <!-- LOBBY MAIN -->
  <div id="lobby" class="stack">
    <div id="homeBox" class="stack">
      <div class="row between">
        <h2>Your Nickname: <b id="myNickDisplay" style="color:#fbbf24">Player</b></h2>

      </div>
      <div class="two">
        <button class="green" id="createBtn">+ Create Room</button>
        <div class="row" style="gap:4px"><input id="codeIn" placeholder="XG-XXXXX" maxlength="10" style="text-transform:uppercase"><button id="joinBtn">Join</button></div>
      </div>
    </div>

    <!-- ROOM LOBBY PANEL -->
    <div id="roomPanel" class="panel hidden">
      <div class="lbl">Room Code</div>
      <div class="codeBig" id="codeBig">XG-XXXXX</div>
      <div class="two" style="margin:8px 0">
        <button class="blue" id="shareBtn">🔗 Share / Invite</button>
        <button class="purple" id="copyBtn">Copy Code</button>
      </div>
      <div class="row between" style="margin-bottom:8px">
        <label style="font-size:12px;color:#a5b4fc;font-weight:700">Game Rules:</label>

      </div>
      <button id="leaveBtn" style="width:100%;margin-bottom:8px">Leave Room / Arcade Hub</button>
      <div class="row between" style="margin-bottom:4px">
        <b style="color:#fbbf24;font-size:13px">Players (<span id="pc">1</span>/4)</b>
        <button class="purple" id="botBtn" style="padding:6px 10px;font-size:11px">+ Add Bot</button>
      </div>
      <div id="plist"></div>
      <button class="green" id="startBtn" style="width:100%;margin-top:10px">Start Yard Dominoes</button>
      <div id="guestWaitMsg" class="lbl hidden" style="color:#fbbf24;margin-top:10px">Waiting for the Host to start the match...</div>
    </div>
  </div>

  <!-- GAME BOARD VIEW -->
  <div id="game" class="stack hidden">
    <div class="voice-bar">
      <div class="voice-status">
        <div id="micDot" class="mic-dot"></div>
        <span>🎙️ Yard Voice</span>
      </div>
      <div class="row" style="gap:4px">
        <button id="speakerBtn" class="blue" style="padding:4px 10px;font-size:11px">🔊 Speaker: OFF</button>
        <button id="micBtn" class="blue" style="padding:4px 10px;font-size:11px">Enable Mic</button>
      </div>
    </div>
    <div class="score">
      <div id="scoreBoxL">N/S<span class="pill" id="sNS">0</span></div>
      <div class="mid"><span id="handLbl">Hand 1</span><i id="modeLbl">Cut Throat</i></div>
      <div id="scoreBoxR">E/W<span class="pill" id="sWE">0</span></div>
    </div>

    <!-- SEATS OUTSIDE BOARD -->
    <div id="seatOverlayOutside" class="seat-grid-outside"></div>
    
    <div class="wrap" id="wrap">
      <canvas id="board" width="800" height="720"></canvas>
    </div>

    <div id="log">Connecting to room...</div>
    <div class="panel">
      <div class="lbl" id="turnLbl">Your hand</div>
      <div class="hand" id="hand"></div>
      <div id="endBar" class="two hidden" style="margin-top:8px">
        <button class="gold" id="goL">Play left (<span id="lv">-</span>)</button>
        <button class="gold" id="goR">Play right (<span id="rv">-</span>)</button>
      </div>
      <button id="passBtn" class="hidden" style="width:100%;margin-top:8px;color:#fcd34d">Knock table (pass)</button>
      <button id="againBtn" class="green hidden" style="width:100%;margin-top:8px">Play another match</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="audioBox"></div>

<script>
/* ---------- SUPABASE & LIVEKIT CONFIG ---------- */
const SB_URL = 'https://vlrscrzwqjkresgvcygh.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZscnNjcnp3cWprcmVzZ3ZjeWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDExMjMsImV4cCI6MjEwNzg3NzEyM30.8ttvi0_BkIrPa7KQ7L4zcxBPHNz-e_gsbcF1Bep4b90';
const LIVEKIT_URL = 'wss://xgames-bjyx6237.livekit.cloud';

const sb = supabase.createClient(SB_URL, SB_KEY);

let roomSubscription = null, pollTimer = null, joinRetryTimer = null, livekitRoom = null;
let roomCode = '', mySeatPos = 'S', micActive = false, speakerEnabled = false;
let stateVersion = 0, lastAppliedVersion = -1, joinConfirmed = false, syncing = false, syncDirty = false;
let mutedPlayers = new Set(), gameMode = 'cutthroat';
let scores = { S: 0, W: 0, N: 0, E: 0 };

/* PERMANENT DEVICE IDENTITY */
let myClientId = localStorage.getItem('xg_perm_client_id');
if (!myClientId) {
  myClientId = 'p_' + Math.random().toString(36).slice(2, 11);
  localStorage.setItem('xg_perm_client_id', myClientId);
}

let myNickname = localStorage.getItem('xg_perm_nickname') || '';

/* ---------- AUDIO SOUND EFFECTS ---------- */
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(f1, f2, d, type, vol, delay = 0) {
  try {
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.01, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const clack = () => tone(480, 90, .05, 'sine', .5);
const slam = () => { tone(180, 20, .22, 'triangle', 1); tone(650, 110, .06, 'square', .7); shake(); };
const knock = () => { tone(240, 60, .04, 'sine', .6); tone(240, 60, .04, 'sine', .6, .09); };
const fanfare = () => [261.63, 329.63, 392, 523.25, 659.25].forEach((f, i) => tone(f, 0, .3, 'sine', .35, i * .09));
function shake() {
  const w = $('wrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
  setTimeout(() => w.classList.remove('shake'), 260);
}

/* ---------- HELPERS ---------- */
const $ = id => document.getElementById(id);
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
const log = m => $('log').textContent = m;
const pick = (v, cur) => (v === undefined ? cur : v);

/* ---------- STATE ---------- */
const NEXT = { N: 'W', W: 'S', S: 'E', E: 'N' };
let lobby = [], botN = 0, isHost = false, hostClientId = '', roomStatus = 'waiting';
let handNo = 1, sNS = 0, sWE = 0, lastWin = null, needD6 = true;
let players = [], turn = 'S', L = null, R = null, center = null, lb = [], rb = [], passes = 0, active = false, epoch = 0, matchOver = false;
const byPos = p => players.find(x => x.pos === p);

/* ---------- PROFILE CONTROLLER ---------- */
function initProfile() {
  if (!myNickname) {
    $('homeBox').classList.add('hidden');
    $('profileBox').classList.remove('hidden');
  } else {
    $('myNickDisplay').textContent = myNickname;
    $('profileBox').classList.add('hidden');
    $('homeBox').classList.remove('hidden');
  }
}

$('saveProfileBtn').onclick = () => {
  const inputVal = $('profileNameIn').value.trim();
  if (!inputVal) return toast('Please enter a nickname');
  myNickname = inputVal;
  localStorage.setItem('xg_perm_nickname', myNickname);
  $('myNickDisplay').textContent = myNickname;
  $('profileBox').classList.add('hidden');
  $('homeBox').classList.remove('hidden');
  toast('Profile saved!');

  const params = new URLSearchParams(window.location.search);
  const roomParam = params.get('room');
  if (roomParam) joinRoomByCode(roomParam.toUpperCase());
};

$('editProfileBtn').onclick = () => {
  $('profileNameIn').value = myNickname;
  $('homeBox').classList.add('hidden');
  $('profileBox').classList.remove('hidden');
};

/* ---------- ROOM SYNC ---------- */
function snapshot() {
  return { version: stateVersion, status: roomStatus, hostClientId, handNo, sNS, sWE, scores, gameMode, lastWin, needD6, players, turn, L, R, center, lb, rb, passes, active, matchOver, lobby };
}

async function syncRoomState() {
  if (!roomCode || !isHost) return;
  stateVersion++;
  if (roomSubscription) roomSubscription.send({ type: 'broadcast', event: 'STATE', payload: snapshot() });

  if (syncing) { syncDirty = true; return; }
  syncing = true;
  try {
    do {
      syncDirty = false;
      const st = snapshot();
      await sb.from('game_rooms').upsert({ room_code: roomCode, status: roomStatus, state: st, updated_at: new Date().toISOString() }, { onConflict: 'room_code' });
    } while (syncDirty);
  } catch (e) { console.error('Save failed', e); }
  syncing = false;
}

function applyState(st, force) {
  if (!st) return;
  if (isHost && !force) return;
  const v = typeof st.version === 'number' ? st.version : 0;
  if (!force && v <= lastAppliedVersion) return;
  lastAppliedVersion = v;

  roomStatus = pick(st.status, roomStatus);
  hostClientId = pick(st.hostClientId, hostClientId);
  handNo = pick(st.handNo, handNo); sNS = pick(st.sNS, sNS); sWE = pick(st.sWE, sWE);
  gameMode = pick(st.gameMode, gameMode);
  if (st.scores) scores = st.scores;
  lastWin = pick(st.lastWin, lastWin); needD6 = pick(st.needD6, needD6);
  if (st.players && st.players.length) players = st.players;
  turn = pick(st.turn, turn); L = pick(st.L, L); R = pick(st.R, R); center = pick(st.center, center);
  lb = st.lb || []; rb = st.rb || [];
  passes = pick(st.passes, passes); active = pick(st.active, active); matchOver = pick(st.matchOver, matchOver);

  if (st.lobby) {
    lobby = st.lobby;
    const me = lobby.find(p => p.clientId === myClientId);
    if (me) {
      mySeatPos = me.pos; joinConfirmed = true; clearInterval(joinRetryTimer);
    } else if (joinConfirmed && !isHost) {
      leaveToHome('The host removed you from the table.');
      return;
    }
    renderLobby();
  }

  if (roomStatus === 'playing' && $('game').classList.contains('hidden')) {
    $('lobby').classList.add('hidden');
    $('game').classList.remove('hidden');
  }
  refresh();
}

async function fetchLatestState() {
  if (!roomCode) return;
  const { data } = await sb.from('game_rooms').select('state').eq('room_code', roomCode).maybeSingle();
  if (data && data.state) applyState(data.state);
}

function stopListening() {
  clearInterval(pollTimer); clearInterval(joinRetryTimer);
  if (roomSubscription) { sb.removeChannel(roomSubscription); roomSubscription = null; }
}

function listenToRoom() {
  stopListening();

  roomSubscription = sb.channel('room_' + roomCode)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_rooms', filter: 'room_code=eq.' + roomCode }, payload => {
      if (!isHost && payload.new) applyState(payload.new.state);
    })
    .on('broadcast', { event: 'STATE' }, ({ payload }) => { if (!isHost) applyState(payload); })
    .on('broadcast', { event: 'JOIN_EVENT' }, ({ payload }) => { if (isHost) handleJoin(payload); })
    .on('broadcast', { event: 'JOIN_DENIED' }, ({ payload }) => {
      if (payload && payload.clientId === myClientId) leaveToHome(payload.reason || 'The host could not seat you.');
    })
    .on('broadcast', { event: 'ROOM_CLOSED' }, () => { if (!isHost) leaveToHome('The host closed the room.'); })
    .on('broadcast', { event: 'ACTION_MOVE' }, ({ payload }) => { if (isHost) handleMove(payload); })
    .subscribe(status => {
      if (status !== 'SUBSCRIBED') return;
      if (!isHost) { fetchLatestState(); startJoinRetry(); }
    });

  if (!isHost) pollTimer = setInterval(fetchLatestState, 3000);
}

function startJoinRetry() {
  clearInterval(joinRetryTimer);
  if (joinConfirmed) return;
  let tries = 0;
  const send = () => {
    if (joinConfirmed || !roomSubscription) { clearInterval(joinRetryTimer); return; }
    if (++tries > 12) {
      clearInterval(joinRetryTimer);
      toast("Couldn't reach the host. Ask them to keep the room open.");
      return;
    }
    roomSubscription.send({ type: 'broadcast', event: 'JOIN_EVENT', payload: { clientId: myClientId, name: myNickname } });
  };
  send();
  joinRetryTimer = setInterval(send, 1500);
}

function denyJoin(clientId, reason) {
  if (roomSubscription) roomSubscription.send({ type: 'broadcast', event: 'JOIN_DENIED', payload: { clientId, reason } });
}

function handleJoin(g) {
  if (!g || typeof g.clientId !== 'string') return;
  if (!lobby.some(p => p.clientId === g.clientId)) {
    if (roomStatus === 'playing') return denyJoin(g.clientId, 'That match has already started.');
    if (lobby.length >= 4) return denyJoin(g.clientId, 'The room is full.');
    const freePos = ['S', 'W', 'N', 'E'].find(pos => !lobby.some(p => p.pos === pos));
    const name = String(g.name || 'Player').slice(0, 15);
    lobby.push({ clientId: g.clientId, name, isBot: false, pos: freePos, isHost: false });
    renderLobby();
    toast(name + ' joined the table!');
  }
  syncRoomState();
}

function handleMove(mv) {
  if (!isHost || !mv || !active) return;
  const cur = byPos(turn);
  if (!cur || cur.ai || cur.clientId !== mv.clientId) return;

  if (mv.type === 'PLAY') {
    const t = cur.hand[mv.index];
    if (!t || !isValid(t)) return;
    if (!center) { if (mv.side !== 'first') return; }
    else if (mv.side === 'left') { if (!(t.a === L || t.b === L)) return; }
    else if (mv.side === 'right') { if (!(t.a === R || t.b === R)) return; }
    else return;
    play(mv.index, mv.side);
  } else if (mv.type === 'PASS') {
    if (center && cur.hand.some(isValid)) return;
    pass();
  }
}

/* ---------- LOBBY CONTROLLER ---------- */
$('createBtn').onclick = async () => {
  if (!myNickname) return initProfile();

  const code = 'XG-' + Math.random().toString(36).slice(2, 7).toUpperCase();
  const myEntry = { clientId: myClientId, name: myNickname, isBot: false, pos: 'S', isHost: true };
  gameMode = $('modeSelect').value;

  const { error } = await sb.from('game_rooms').insert([{
    room_code: code,
    status: 'waiting',
    state: { version: 0, status: 'waiting', hostClientId: myClientId, lobby: [myEntry], handNo: 1, sNS: 0, sWE: 0, gameMode, scores }
  }]);
  if (error) { console.error(error); toast('Error creating room'); return; }

  roomCode = code; isHost = true; hostClientId = myClientId; mySeatPos = 'S'; roomStatus = 'waiting';
  joinConfirmed = true; stateVersion = 0; lastAppliedVersion = -1;
  lobby = [myEntry];
  $('roomBadge').textContent = 'Room: ' + roomCode; $('codeBig').textContent = roomCode;
  $('homeBox').classList.add('hidden'); $('roomPanel').classList.remove('hidden');
  renderLobby(); refresh();
  toast('Room ' + roomCode + ' created!');
  listenToRoom();
};

$('joinBtn').onclick = () => {
  if (!myNickname) return initProfile();
  const code = $('codeIn').value.trim().toUpperCase();
  if (!code) return toast('Enter a room code');
  joinRoomByCode(code);

async function joinRoomByCode(code) {

/* ---------- VOICE (LiveKit WebRTC + Safari Track Release) ---------- */
async function connectVoice() {
  if (livekitRoom) return true;
  if (!window.LivekitClient) { toast('Voice failed to load. Refresh and try again.'); return false; }
  if (!roomCode) { toast('Join a room first'); return false; }

  const { data, error } = await sb.functions.invoke('livekit-token', {
    body: { roomCode, clientId: myClientId, name: myNickname }
  });
  if (error || !data || !data.token) {
    console.error('Voice token error', error, data);
    toast('Voice token error. Check Supabase setup.');
    return false;
  }

  const room = new LivekitClient.Room({ 
    adaptiveStream: true, 
    dynacast: true,
    audioCaptureDefaults: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  });

  room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
    if (track.kind === 'audio') {
      const el = track.attach();
      el.id = 'audio_' + participant.identity;
      el.autoplay = true;
      el.playsInline = true;

      if (mutedPlayers.has(participant.identity)) {
        el.muted = true;
      }

      $('audioBox').appendChild(el);
      if (speakerEnabled) routeToSpeaker(el);
    }
  });

  room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
    track.detach().forEach(el => el.remove());
  });

  room.on(LivekitClient.RoomEvent.Disconnected, () => {
    if (livekitRoom === room) { livekitRoom = null; micActive = false; updateMicUI(false, true); }
  });

  await room.connect(LIVEKIT_URL, data.token);
  try { await room.startAudio(); } catch (e) { console.log('Audio autoplay prompt needed'); }
  livekitRoom = room;
  return true;
}

async function routeToSpeaker(audioEl) {
  if (audioEl && typeof audioEl.setSinkId === 'function') {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const speaker = devices.find(d => d.kind === 'audiooutput' && (d.deviceId === 'speaker' || d.label.toLowerCase().includes('speaker')));
      if (speaker) await audioEl.setSinkId(speaker.deviceId);
    } catch(e) {}
  }
}

/* ---------- GAME CORE ---------- */
function fullSet() {
  const t = [];
  for (let i = 0; i <= 6; i++) for (let j = i; j <= 6; j++) t.push({ a: i, b: j, d: i === j });
  for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
  return t;
}

function newMatch() {
  $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
  sNS = 0; sWE = 0; scores = { S: 0, W: 0, N: 0, E: 0 }; handNo = 1; lastWin = null; matchOver = false;
  newHand();
}

function newHand() {
  epoch++;
  const deck = fullSet();
  players = ['S', 'W', 'N', 'E'].map((pos, i) => {
    const playerObj = lobby.find(l => l.pos === pos) || { clientId: 'bot_' + (i + 1), name: 'XBot-' + (i + 1), isBot: true };
    return { clientId: playerObj.clientId, name: playerObj.name, pos, hand: deck.slice(i * 7, i * 7 + 7), ai: playerObj.isBot };
  });
  center = null; L = R = null; lb = []; rb = []; passes = 0; active = true; $('againBtn').classList.add('hidden');
  needD6 = lastWin === null;
  if (needD6) {
    turn = players.find(p => p.hand.some(t => t.a === 6 && t.b === 6)).pos;
    log(byPos(turn).name + ' holds [6|6] and poses first.');
  } else {
    turn = lastWin; log('Hand ' + handNo + ': ' + byPos(turn).name + ' poses first.');
  }
  refresh(); syncRoomState(); maybeAi();
}

function isValid(t) {
  if (!center) return needD6 ? (t.a === 6 && t.b === 6) : true;
  return t.a === L || t.b === L || t.a === R || t.b === R;
}

function play(i, side) {
  if (!isHost) {
    if (roomSubscription) {
      roomSubscription.send({ type: 'broadcast', event: 'ACTION_MOVE', payload: { type: 'PLAY', index: i, side, clientId: myClientId } });
    }
    return;
  }
  const p = byPos(turn), t = p.hand.splice(i, 1)[0]; passes = 0;
  if (side === 'first') { center = { a: t.a, b: t.b, d: t.d }; L = t.a; R = t.b; }
  else if (side === 'left') { const o = t.a === L ? { a: t.a, b: t.b, d: t.d } : { a: t.b, b: t.a, d: t.d }; L = o.b; lb.push(o); }
  else { const o = t.a === R ? { a: t.a, b: t.b, d: t.d } : { a: t.b, b: t.a, d: t.d }; R = o.b; rb.push(o); }
  (t.d || !p.hand.length) ? slam() : clack();
  log('💥 ' + p.name + ' slammed [' + t.a + '|' + t.b + ']');
  if (!p.hand.length) return win(p.pos, p.name + ' went out!');
  next();
}

function pass() {
  if (!isHost) {
    if (roomSubscription) {
      roomSubscription.send({ type: 'broadcast', event: 'ACTION_MOVE', payload: { type: 'PASS', clientId: myClientId } });
    }
    return;
  }
  const p = byPos(turn); passes++; knock(); log('✋ ' + p.name + ' knocked (passed).');
  if (passes >= 4) return blocked();
  next();
}

function next() { turn = NEXT[turn]; refresh(); syncRoomState(); maybeAi(); }

function maybeAi() {
  if (!isHost) return;
  const e = epoch, cur = byPos(turn);
  if (active && cur && cur.ai) setTimeout(() => { if (e === epoch && active) aiTurn(); }, 900);
}

function aiTurn() {
  const p = byPos(turn);
  if (!p) return;
  const opts = [];
  p.hand.forEach((t, i) => {
    if (!isValid(t)) return;
    if (!center) opts.push({ i, side: 'first', w: t.a + t.b });
    else {
      if (t.a === L || t.b === L) opts.push({ i, side: 'left', w: t.a + t.b });
      if (t.a === R || t.b === R) opts.push({ i, side: 'right', w: t.a + t.b });
    }
  });
  if (!opts.length) return pass();
  opts.sort((x, y) => y.w - x.w + (Math.random() - .5) * 3);
  play(opts[0].i, opts[0].side);
}

function blocked() {
  let pScores = {};
  players.forEach(p => { pScores[p.pos] = p.hand.reduce((a, t) => a + t.a + t.b, 0); });
  if (gameMode === 'partners') {
    const ns = pScores.N + pScores.S, we = pScores.W + pScores.E;
    if (ns < we) win('S', 'Blocked! N/S win (' + ns + ' vs ' + we + ' pips)');
    else if (we < ns) win('E', 'Blocked! E/W win (' + we + ' vs ' + ns + ' pips)');
    else {
      active = false; log('🤝 Blocked and tied. Replaying hand.'); const e = epoch;
      syncRoomState();
      setTimeout(() => { if (e === epoch) { handNo++; newHand(); } }, 3000);
    }
  } else {
    let sorted = Object.keys(pScores).sort((a,b) => pScores[a] - pScores[b]);
    if (pScores[sorted[0]] < pScores[sorted[1]]) {
      win(sorted[0], 'Blocked! ' + byPos(sorted[0]).name + ' wins (' + pScores[sorted[0]] + ' pips)');
    } else {
      active = false; log('🤝 Blocked and tied. Replaying hand.'); const e = epoch;
      syncRoomState();
      setTimeout(() => { if (e === epoch) { handNo++; newHand(); } }, 3000);
    }
  }
}

function win(pos, why) {
  fanfare(); active = false; lastWin = pos;
  if (gameMode === 'partners') {
    const ns = pos === 'N' || pos === 'S';
    if (ns) { if (sWE > 0 && sNS === 0) { toast('BREAK! Score reset to 0-0'); sWE = 0; } sNS++; }
    else { if (sNS > 0 && sWE === 0) { toast('BREAK! Score reset to 0-0'); sNS = 0; } sWE++; }
    log('🎉 ' + why);
    if (sNS >= 6 || sWE >= 6) {
      matchOver = true; log('🏆 Match over: Team ' + (sNS >= 6 ? 'N/S' : 'E/W') + ' wins six love!');
      refresh(); syncRoomState(); return;
    }
  } else {
    scores[pos] = (scores[pos] || 0) + 1;
    log('🎉 ' + why);
    if (scores[pos] >= 6) {
      matchOver = true; log('🏆 Match over: ' + byPos(pos).name + ' wins six love!');
      refresh(); syncRoomState(); return;
    }
  }
  refresh(); syncRoomState(); const e = epoch;
  setTimeout(() => { if (e === epoch) { handNo++; newHand(); } }, 3500);
}

/* ---------- CANVAS BOARD ENGINE (WATERTIGHT 48px ROW STRIDE) ---------- */
const cv = $('board'), ctx = cv.getContext('2d');
const W = 400, H = 360, MARGIN = 30, CY = 180;
const PIPS = { 0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function pips(c, x, y, w, h, n, s) {
  c.fillStyle = '#111827';
  PIPS[n].forEach(i => {
    c.beginPath(); c.arc(x + w * (0.2 + 0.3 * (i % 3)), y + h * (0.2 + 0.3 * ((i / 3) | 0)), 1.8 * s, 0, 7); c.fill();
  });
}
function drawTile(c, x, y, a, b, vert, s) {
  s = s || 1; 
  const w = vert ? 20 * s : 40 * s;
  const h = vert ? 40 * s : 20 * s;
  
  c.save(); 
  c.translate(x, y);
  
  c.shadowColor = 'rgba(0,0,0,0.35)'; 
  c.shadowBlur = 4 * s; 
  c.shadowOffsetY = 2 * s;
  
  rr(c, -w / 2, -h / 2, w, h, 4 * s); 
  c.fillStyle = '#ffffff'; 
  c.fill();
  
  c.shadowColor = 'transparent';
  c.lineWidth = 1; 
  c.strokeStyle = '#cbd5e1'; 
  c.stroke();
  
  c.strokeStyle = '#94a3b8'; 
  c.beginPath(); 
  if (vert) {
    c.moveTo(-w / 2 + 2 * s, 0); 
    c.lineTo(w / 2 - 2 * s, 0);
  } else {
    c.moveTo(0, -h / 2 + 2 * s); 
    c.lineTo(0, h / 2 - 2 * s);
  }
  c.stroke();
  
  if (vert) {
    pips(c, -w / 2, -h / 2, w, h / 2, a, s);
    pips(c, -w / 2, 0, w, h / 2, b, s);
  } else {
    pips(c, -w / 2, -h / 2, w / 2, h, a, s);
    pips(c, 0, -h / 2, w / 2, h, b, s);
  }
  
  c.restore();
}

/* Clean Dynamic Layout Engine with 48px Row Centerline Stride */
function layoutChain(tiles, startX, y0, dir, rowDir) {
  let x = startX, y = y0; 
  const out = [];
  const limitR = W - MARGIN - 12;
  const limitL = MARGIN + 12;

  tiles.forEach(t => {
    let isVert = t.d;
    let tw = isVert ? 20 : 40;
    
    // Check if standard horizontal tile exceeds edge
    const willOverflow = dir > 0 ? (x + dir * tw > limitR) : (x + dir * tw < limitL);

    if (willOverflow) {
      // FORCE THIS TILE TO BE A VERTICAL ELBOW CONNECTOR
      isVert = true;
      tw = 20;
      const elbowX = x + dir * (tw / 2);
      const elbowY = y + rowDir * 20; // Bridge down cleanly from top row
      out.push({ t, cx: elbowX, cy: elbowY, vert: true });
      
      // Step down by 48px row stride (gives 28px clean vertical space between rows)
      y += rowDir * 48;
      dir = -dir;
      x = elbowX + dir * 10;
    } else {
      out.push({ t, cx: x + dir * (tw / 2), cy: y, vert: isVert });
      x += dir * tw;
    }
  });
  return { out, x, y, dir };
}

function endTag(x, y, dir, txt) {
  const w = 26, h = 13;
  let cx = x + dir * (w / 2 + 6);
  cx = Math.min(W - MARGIN - w / 2, Math.max(MARGIN + w / 2, cx));
  rr(ctx, cx - w / 2, y - h / 2, w, h, 6);
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = '#7c5a1c'; ctx.stroke();
  ctx.fillStyle = '#fcd34d'; ctx.font = '700 8px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, cx, y + 0.5);
}

}

function drawBoard() {
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, W, H);
  
  const g = ctx.createLinearGradient(0, 0, 0, H); 
  g.addColorStop(0, '#155e2b'); 
  g.addColorStop(1, '#0f441f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  
  renderOutsideSeats();
  
  if (!center) {
    ctx.fillStyle = '#fcd34d'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(needD6 ? 'Pose [6|6] to start the hand' : 'Table empty. Pose any tile', W / 2, CY); 
    return;
  }
  
  const cx = W / 2, cy = CY, cw = center.d ? 20 : 40;
  const lay = layoutChain(lb, cx - cw / 2, cy, -1, -1);
  const ray = layoutChain(rb, cx + cw / 2, cy, 1, 1);
  
  drawTile(ctx, cx, cy, center.a, center.b, center.d, 1);
  
  lay.out.forEach(o => drawTile(ctx, o.cx, o.cy, o.t.a, o.t.b, o.vert, 1));
  ray.out.forEach(o => drawTile(ctx, o.cx, o.cy, o.t.a, o.t.b, o.vert, 1));
  
  endTag(lay.x, lay.y, lay.dir, 'L ' + L);
  endTag(ray.x, ray.y, ray.dir, 'R ' + R);
}

/* ---------- REFRESH ---------- */
function refresh() {
  $('syncLabel').textContent = roomCode ? 'Online Sync Active' : 'Offline Practice';
  
  if (gameMode === 'partners') {
    $('scoreBoxL').innerHTML = 'N/S<span class="pill" id="sNS">' + sNS + '</span>';
    $('scoreBoxR').innerHTML = 'E/W<span class="pill" id="sWE">' + sWE + '</span>';
    $('modeLbl').textContent = 'Partners (2v2)';
  } else {
    $('scoreBoxL').innerHTML = 'S:' + scores.S + ' W:' + scores.W;
    $('scoreBoxR').innerHTML = 'N:' + scores.N + ' E:' + scores.E;
    $('modeLbl').textContent = 'Cut Throat (FFA)';
  }
  
  $('handLbl').textContent = 'Hand ' + handNo;
  const currPlayer = byPos(turn);
  $('turnLbl').textContent = matchOver ? 'Match over' : (turn === mySeatPos && active ? 'Your turn' : 'Turn: ' + (currPlayer ? currPlayer.name : 'Waiting...'));
  selIdx = null; drawBoard(); renderHand();
  $('againBtn').classList.toggle('hidden', !(matchOver && isHost));
}

$('againBtn').onclick = () => { if (isHost) newMatch(); };
</script>
