<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YardVibes Multi-Shop Cookshop</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- React & ReactDOM -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel for JSX -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
body { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const INITIAL_SHOPS = {
shop1: {
id: 'shop1',
name: "Mama's Yard Cookshop",
tagline: "Authentic Jamaican Flame & Pot",
whatsapp: "8765550192",
address: "Main Street, Montego Bay",
pin: "1234",
crossPromoName: "Auntie's Ital Corner",
crossPromoId: "shop2",
isOpen: true,
autoCloseEnabled: true,
closeHour: 21,
deliveryEnabled: true,
eventMode: false,
eventTitle: "Weekend Fish Fry & Soup Special!",
eventBanner: "Live Red Peas Soup & Fried Snapper available today!",
deliveryFee: 300,
supabaseUrl: "",
supabaseKey: "",
theme: {
primaryBg: "bg-emerald-950",
primaryBorder: "border-emerald-800/60",
accentText: "text-emerald-400",
accentBg: "bg-emerald-600 hover:bg-emerald-500",
badgeBg: "bg-emerald-900/40 text-emerald-200 border-emerald-700/40"
},
menu: [
{ id: 1, name: "Brown Stew Chicken", price: 900, category: "Mains", soldOut: false, desc: "Tender chicken simmered in rich gravy with carrots & butter beans." },
{ id: 2, name: "Curry Goat", price: 1200, category: "Mains", soldOut: false, desc: "Slow-cooked tender goat meat packed with authentic curry spices." },
{ id: 3, name: "Fried Dumpling & Ackee & Saltfish", price: 1000, category: "Breakfast / Staples", soldOut: false, desc: "National dish served with hot golden fried dumplings." },
{ id: 4, name: "Rice & Peas", price: 350, category: "Sides", soldOut: false, desc: "Gungo peas and coconut milk seasoned to perfection." },
{ id: 5, name: "Soup of the Day (Red Peas)", price: 500, category: "Soups", soldOut: false, desc: "Loaded with beef, spinners, yam, and red peas." },
{ id: 6, name: "Ice-Cold Carrot Juice", price: 250, category: "Drinks", soldOut: false, desc: "Blended fresh with condensed milk, spices, and vanilla." }
 ]
},
shop2: {
id: 'shop2',
name: "Auntie's Ital Corner",
tagline: "Pure Natural Livity & Plant-Based Meals",
whatsapp: "8765550999",
address: "Market Square, Montego Bay",
pin: "5678",
crossPromoName: "Mama's Yard Cookshop",
crossPromoId: "shop1",
isOpen: true,
autoCloseEnabled: true,
closeHour: 20,
deliveryEnabled: true,
eventMode: false,
eventTitle: "Ital Stew Special",
eventBanner: "Fresh coconut run-down with breadfruit and callaloo.",
deliveryFee: 250,
supabaseUrl: "",
supabaseKey: "",
theme: {
primaryBg: "bg-amber-950",
primaryBorder: "border-amber-800/60",
accentText: "text-amber-400",
accentBg: "bg-amber-600 hover:bg-amber-500",
badgeBg: "bg-amber-900/40 text-amber-200 border-amber-700/40"
},
menu: [
{ id: 201, name: "Ital Coconut Stew", price: 800, category: "Mains", soldOut: false, desc: "Fresh vegetables simmered in pure coconut cream." },
{ id: 202, name: "Roasted Breadfruit & Callaloo", price: 700, category: "Mains", soldOut: false, desc: "Flame-roasted breadfruit loaded with steamed seasoned callaloo." },
{ id: 203, name: "Natural Soursop Juice", price: 300, category: "Drinks", soldOut: false, desc: "Freshly squeezed natural soursop with touch of cane and lime." }
 ]
}
};

const MASTER_PIN = "9999";

function App() {
const [currentShopId, setCurrentShopId] = useState('shop1');
const [shops, setShops] = useState(() => {
const saved = localStorage.getItem('yardvibes_shops_v8');
return saved ? JSON.parse(saved) : INITIAL_SHOPS;
});
const [cart, setCart] = useState([]);
const [fulfillment, setFulfillment] = useState('pickup');
const [deliveryAddress, setDeliveryAddress] = useState('');
const [paymentMethod, setPaymentMethod] = useState('Cash');
const [bankRef, setBankRef] = useState('');
const [orders, setOrders] = useState(() => {
const saved = localStorage.getItem('yardvibes_orders_v8');
return saved ? JSON.parse(saved) : [];
});
const [suggestions, setSuggestions] = useState(() => {
const saved = localStorage.getItem('yardvibes_suggestions_v8');
return saved ? JSON.parse(saved) : [
{ id: 1, text: "Oxtail with Broad Beans", votes: 14 },
{ id: 2, text: "Curry Mutton Weekend Special", votes: 9 }
 ];
});
const [newSuggestion, setNewSuggestion] = useState('');

const [activeTab, setActiveTab] = useState('menu');
const [isAdminOpen, setIsAdminOpen] = useState(false);
const [adminRole, setAdminRole] = useState(null);
const [enteredPin, setEnteredPin] = useState('');
const [authError, setAuthError] = useState('');

const [customizingItem, setCustomizingItem] = useState(null);
const [spiceLevel, setSpiceLevel] = useState('Normal Pepper');
const [gravyOption, setGravyOption] = useState('Normal Gravy');
const [itemNote, setItemNote] = useState('');
const [editingDish, setEditingDish] = useState(null);

const activeShop = shops[currentShopId] || shops['shop1'];
const t = activeShop.theme;

useEffect(() => {
localStorage.setItem('yardvibes_shops_v8', JSON.stringify(shops));
}, [shops]);

useEffect(() => {
localStorage.setItem('yardvibes_orders_v8', JSON.stringify(orders));
}, [orders]);

useEffect(() => {
localStorage.setItem('yardvibes_suggestions_v8', JSON.stringify(suggestions));
}, [suggestions]);

useEffect(() => {
const checkAutoClose = () => {
const now = new Date();
const currentHour = now.getHours();
setShops(prev => {
const updated = { ...prev };
Object.keys(updated).forEach(id => {
if (updated[id].autoCloseEnabled && currentHour >= updated[id].closeHour) {
updated[id].isOpen = false;
}
});
return updated;
});
};
checkAutoClose();
const interval = setInterval(checkAutoClose, 60000);
return () => clearInterval(interval);
}, []);

const playChime = () => {
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(587.33, ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
gain.gain.setValueAtTime(0.3, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.5);
} catch(e) { console.log("Audio not supported"); }
};

const addToCartConfirmed = () => {
if (!customizingItem) return;
const cartItem = {
...customizingItem,
cartId: Date.now(),
spice: spiceLevel,
gravy: gravyOption,
note: itemNote
};
setCart([...cart, cartItem]);
setCustomizingItem(null);
setSpiceLevel('Normal Pepper');
setGravyOption('Normal Gravy');
setItemNote('');
};

const removeFromCart = (cartId) => {
setCart(cart.filter(item => item.cartId !== cartId));
};

const cartTotal = cart.reduce((sum, item) => sum + item.price, 0);
const finalTotal = cartTotal + (fulfillment === 'delivery' && activeShop.deliveryEnabled ? activeShop.deliveryFee : 0);

const handleCheckoutWhatsApp = () => {
if (cart.length === 0) return;
const orderNum = Math.floor(1000 + Math.random() * 9000);
let text = *NEW ORDER #${orderNum}* 🛒\nShop:${activeShop.name}\n*Fulfillment:* ${fulfillment.toUpperCase()}\n; if(fulfillment === 'delivery') text +=Delivery Address:${deliveryAddress}\n;
text += *Payment:* ${paymentMethod} ${paymentMethod === 'Bank Transfer' ?(Ref: ${bankRef}) : ''}\n\nItems:\n`;

cart.forEach((item, idx) => {
text += ``${idx + 1}. {item.price}\n └ Spice: {item.gravy}\n; if(item.note) text += └ Note: latex
{item.note}\n`; }); text += `\n*Total: 

{finalTotal}*`;

const newOrderObj = {
id: orderNum,
shopId: currentShopId,
items: cart,
fulfillment,
deliveryAddress,
paymentMethod,
bankRef,
total: finalTotal,
time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
status: 'Pending'
};
setOrders([newOrderObj, ...orders]);
playChime();

window.open(https://wa.me/${activeShop.whatsapp}?text=${encodeURIComponent(text)}, '_blank');
setCart([]);
};

const handleCheckoutDM = () => {
let text = NEW ORDER from ${activeShop.name}\nFulfillment: ${fulfillment.toUpperCase()}\n;
if(fulfillment === 'delivery') text += Delivery Address: ${deliveryAddress}\n; cart.forEach((item, idx) =&gt; { text += ``${idx + 1}. ${item.name} (${item.price}) - ${item.spice}, ${item.gravy}\n;
});
text += Total: ${finalTotal}`;
navigator.clipboard.writeText(text);
alert("Order copied to clipboard! Paste it into Instagram or Facebook Messenger DM.");
setCart([]);
};

const handleLogin = (e) => {
e.preventDefault();
setAuthError('');
if (enteredPin === MASTER_PIN) {
setAdminRole('master');
setIsAdminOpen(true);
} else if (enteredPin === activeShop.pin) {
setAdminRole('cousin');
setIsAdminOpen(true);
} else {
setAuthError('Incorrect PIN code.');
}
};

return (
<div className="max-w-md mx-auto min-h-screen bg-slate-900 shadow-2xl flex flex-col border-x border-slate-800">

<header className={``${t.primaryBg} border-b latex
{t.primaryBorder} p-4 sticky top-0 z-30 backdrop-blur transition-colors duration-300`}&gt; &lt;div className="flex justify-between items-center mb-2"&gt; &lt;div&gt; &lt;h1 className={`text-xl font-extrabold 

{t.accentText} tracking-tight}&gt;{activeShop.name}&lt;/h1&gt; &lt;p className="text-xs text-slate-400"&gt;{activeShop.tagline} • {activeShop.address}&lt;/p&gt; &lt;/div&gt; &lt;button onClick={() =&gt; setIsAdminOpen(true)} className={text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 font-medium ${t.accentText}}>
Admin PIN
</button>
</div>

<div className={flex items-center justify-between border rounded-lg px-3 py-1.5 text-xs${t.badgeBg}}&gt; &lt;span&gt;Visit Sister Shop: &lt;strong className="text-white"&gt;{activeShop.crossPromoName}&lt;/strong&gt;&lt;/span&gt; &lt;button onClick={() =&gt; setCurrentShopId(activeShop.crossPromoId)} className={text-white font-bold px-2.5 py-1 rounded shadow transition ${t.accentBg}}>
Switch Shop ↗
</button>
</div>

{activeShop.eventMode && (
<div className="mt-2 bg-amber-500/20 border border-amber-500/50 rounded-lg p-2 text-xs text-amber-200 text-center font-semibold animate-pulse">
🔥 {activeShop.eventTitle}: {activeShop.eventBanner}
</div>
)}
</header>

<main className="flex-1 p-4 pb-24 overflow-y-auto">

{!activeShop.isOpen && (
<div className="bg-red-500/20 border border-red-500/50 p-3 rounded-xl mb-4 text-center">
<p className="text-red-400 font-bold text-sm">Shop is currently CLOSED</p>
<p className="text-xs text-slate-300">Orders are paused until opening hours.</p>
</div>
)}

<div className="grid grid-cols-3 gap-2 mb-4 bg-slate-900 p-1 rounded-xl border border-slate-800">
<button onClick={() => setActiveTab('menu')} className={py-2 rounded-lg text-xs font-bold transition${activeTab === 'menu' ? ${t.accentBg} text-white shadow: 'text-slate-400 hover:text-white'}}>
Menu
</button>
<button onClick={() => setActiveTab('cart')} className={py-2 rounded-lg text-xs font-bold relative transition${activeTab === 'cart' ? ${t.accentBg} text-white shadow: 'text-slate-400 hover:text-white'}}>
Cart {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-amber-500 text-slate-950 rounded-full px-1.5 py-0.2 text-[10px] font-extrabold">{cart.length}</span>}
</button>
<button onClick={() => setActiveTab('suggestions')} className={py-2 rounded-lg text-xs font-bold transition${activeTab === 'suggestions' ? ${t.accentBg} text-white shadow: 'text-slate-400 hover:text-white'}}>
Wishlist 💡
</button>
</div>

{activeTab === 'menu' && (
<div className="space-y-4">
{activeShop.menu.map(item => (
<div key={item.id} className={bg-slate-900 border${item.soldOut ? 'border-red-900/40 opacity-60' : 'border-slate-800'} rounded-2xl p-4 flex flex-col justify-between}&gt; &lt;div&gt; &lt;div className="flex justify-between items-start mb-1"&gt; &lt;h3 className="font-bold text-slate-100"&gt;{item.name}&lt;/h3&gt; &lt;span className={latex
{t.accentText} font-extrabold`}&gt;

{item.price}</span>
</div>
<p className="text-xs text-slate-400 mb-3">{item.desc}</p>
</div>
<div className="flex justify-between items-center mt-2">
<span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-slate-800 text-slate-300">{item.category}</span>
{item.soldOut ? (
<span className="text-xs font-bold text-red-400 bg-red-950/50 px-3 py-1 rounded-lg">Sold Out</span>
) : (
<button
disabled={!activeShop.isOpen}
onClick={() => setCustomizingItem(item)}
className={${t.accentBg} disabled:bg-slate-800 disabled:text-slate-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow transition`}>
+ Customize & Add
</button>
)}
</div>
</div>
))}
</div>
)}

{activeTab === 'cart' && (
<div className="space-y-4">
<h2 className="text-lg font-bold">Your Plate & Order</h2>
{cart.length === 0 ? (
<div className="text-center py-12 text-slate-500 text-sm">Your cart is empty. Pick something tasty from the menu!</div>
) : (
<>
<div className="space-y-3">
{cart.map(item => (
<div key={item.cartId} className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
<div>
<h4 className="font-bold text-sm">{item.name}</h4>
<p className={text-[11px]${t.accentText}}&gt;🌶️ {item.spice} | 🥣 {item.gravy}&lt;/p&gt; {item.note && &lt;p className="text-[10px] text-slate-400 italic"&gt;Note: {item.note}&lt;/p&gt;} &lt;span className="text-xs font-bold text-slate-300"&gt;${item.price}</span>
</div>
<button onClick={() => removeFromCart(item.cartId)} className="text-red-400 text-xs font-bold p-2 hover:bg-red-950/30 rounded-lg">Remove</button>
</div>
))}
</div>

<div className="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-3">
<label className="text-xs font-bold text-slate-300 uppercase tracking-wider">Fulfillment Method</label>
<div className="grid grid-cols-2 gap-2">
<button onClick={() => setFulfillment('pickup')} className={py-2 rounded-lg text-xs font-bold${fulfillment === 'pickup' ? ${t.accentBg} text-white: 'bg-slate-800 text-slate-400'}}>
Pickup
</button>
{activeShop.deliveryEnabled ? (
<button onClick={() => setFulfillment('delivery')} className={py-2 rounded-lg text-xs font-bold${fulfillment === 'delivery' ? ${t.accentBg} text-white: 'bg-slate-800 text-slate-400'}}>
Delivery (+`${activeShop.deliveryFee})
</button>
) : (
<button disabled className="py-2 rounded-lg text-xs font-bold bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed">
Delivery (Paused)
</button>
)}
</div>
{fulfillment === 'delivery' && activeShop.deliveryEnabled && (
<input
type="text"
placeholder="Enter exact delivery address & landmark..."
value={deliveryAddress}
onChange={(e) => setDeliveryAddress(e.target.value)}
className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white"
/>
)}
</div>

<div className="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-3">
<label className="text-xs font-bold text-slate-300 uppercase tracking-wider">Payment Method</label>
<div className="grid grid-cols-3 gap-2">
{['Cash', 'Lynk', 'Bank Transfer'].map(m => (
<button key={m} onClick={() => setPaymentMethod(m)} className={py-2 rounded-lg text-xs font-bold ${paymentMethod === m ? ``${t.accentBg} text-white: 'bg-slate-800 text-slate-400'}}>
{m}
</button>
))}
</div>
{paymentMethod === 'Bank Transfer' && (
<input
type="text"
placeholder="Enter Bank Transfer Reference Code..."
value={bankRef}
onChange={(e) => setBankRef(e.target.value)}
className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white"
/>
)}
</div>

<div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
<div className="flex justify-between text-xs text-slate-400">
<span>Subtotal</span>
<span>latex
{cartTotal}&lt;/span&gt; &lt;/div&gt; {fulfillment === 'delivery' && activeShop.deliveryEnabled && ( &lt;div className="flex justify-between text-xs text-slate-400"&gt; &lt;span&gt;Delivery Fee&lt;/span&gt; &lt;span&gt;

{activeShop.deliveryFee}</span>
</div>
)}
<div className="flex justify-between text-base font-extrabold text-white pt-2 border-t border-slate-800">
<span>Total</span>
<span className={t.accentText}>$`{finalTotal}</span>
</div>

<button
disabled={!activeShop.isOpen || (fulfillment === 'delivery' && !deliveryAddress.trim())}
onClick={handleCheckoutWhatsApp}
className={w-full mt-3${t.accentBg} disabled:bg-slate-800 disabled:text-slate-600 text-white font-extrabold py-3 rounded-xl shadow-lg transition text-sm`}>
Send Order via WhatsApp 💬
</button>
<button
onClick={handleCheckoutDM}
className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl text-xs transition">
Copy Order for IG/FB DM 📋
</button>
</div>
</>
)}
</div>
)}

{activeTab === 'suggestions' && (
<div className="space-y-4">
<h2 className="text-lg font-bold">Customer Suggestion Box 💡</h2>
<p className="text-xs text-slate-400">Vote on future menu items or write in your favorite cravings!</p>

<div className="space-y-2">
{suggestions.map(s => (
<div key={s.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
<span className="text-sm font-medium">{s.text}</span>
<button
onClick={() => {
const updated = suggestions.map(item => item.id === s.id ? {...item, votes: item.votes + 1} : item);
setSuggestions(updated);
}}
className="bg-slate-950 text-slate-300 border border-slate-800 text-xs px-3 py-1.5 rounded-lg font-bold">
👍 {s.votes}
</button>
</div>
))}
</div>

<div className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2">
<label className="text-xs font-bold text-slate-300">Suggest a New Dish</label>
<div className="flex gap-2">
<input
type="text"
placeholder="e.g., Stew Peas with Pigtail..."
value={newSuggestion}
onChange={(e) => setNewSuggestion(e.target.value)}
className="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white"
/>
<button
onClick={() => {
if(!newSuggestion.trim()) return;
setSuggestions([...suggestions, { id: Date.now(), text: newSuggestion, votes: 1 }]);
setNewSuggestion('');
}}
className={${t.accentBg} text-white px-4 py-2 rounded-lg text-xs font-bold`}>
Submit
</button>
</div>
</div>
</div>
)}
</main>

{customizingItem && (
<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 space-y-4">
<div className="flex justify-between items-start">
<h3 className="font-extrabold text-base">{customizingItem.name}</h3>
<button onClick={() => setCustomizingItem(null)} className="text-slate-400 font-bold">✕</button>
</div>

<div className="space-y-1.5">
<label className="text-xs font-bold text-slate-300">Spice Level (Pepper)</label>
<div className="grid grid-cols-3 gap-1.5">
{['No Pepper', 'Normal Pepper', 'Extra Spicy'].map(s => (
<button key={s} onClick={() => setSpiceLevel(s)} className={py-2 text-[11px] font-bold rounded-lg border${spiceLevel === s ? ${t.accentBg} border-transparent text-white: 'bg-slate-950 border-slate-800 text-slate-400'}}>
{s}
</button>
))}
</div>
</div>

<div className="space-y-1.5">
<label className="text-xs font-bold text-slate-300">Gravy Option</label>
<div className="grid grid-cols-3 gap-1.5">
{['No Gravy', 'Normal Gravy', 'Extra Gravy'].map(g => (
<button key={g} onClick={() => setGravyOption(g)} className={py-2 text-[11px] font-bold rounded-lg border${gravyOption === g ? ${t.accentBg} border-transparent text-white: 'bg-slate-950 border-slate-800 text-slate-400'}}>
{g}
</button>
))}
</div>
</div>

<div className="space-y-1.5">
<label className="text-xs font-bold text-slate-300">Special Instructions / Request</label>
<input
type="text"
placeholder="e.g., Well done, pack gravy separate..."
value={itemNote}
onChange={(e) => setItemNote(e.target.value)}
className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white"
/>
</div>

<button onClick={addToCartConfirmed} className={w-full${t.accentBg} text-white font-bold py-3 rounded-xl shadow}&gt; Add to Plate (${customizingItem.price})
</button>
</div>
</div>
)}

{editingDish && (
<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 space-y-4">
<div className="flex justify-between items-start">
<h3 className="font-extrabold text-base">Edit Dish</h3>
<button onClick={() => setEditingDish(null)} className="text-slate-400 font-bold">✕</button>
</div>
<div className="space-y-2">
<label className="text-xs font-bold text-slate-300">Dish Name</label>
<input
type="text"
value={editingDish.name}
onChange={(e) => setEditingDish({...editingDish, name: e.target.value})}
className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white"
/>
</div>
<div className="space-y-2">
<label className="text-xs font-bold text-slate-300">Price ($)&lt;/label&gt; &lt;input type="number" value={editingDish.price} onChange={(e) =&gt; setEditingDish({...editingDish, price: Number(e.target.value)})} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white" /&gt; &lt;/div&gt; &lt;button onClick={() =&gt; { const updatedMenu = activeShop.menu.map(m =&gt; m.id === editingDish.id ? editingDish : m); setShops({...shops, [currentShopId]: {...activeShop, menu: updatedMenu}}); setEditingDish(null); }} className={w-full ${t.accentBg} text-white font-bold py-2.5 rounded-xl text-xs}>
Save Changes
</button>
</div>
</div>
)}

{isAdminOpen && (
<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
<div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 space-y-4 my-auto">

{!adminRole ? (
<form onSubmit={handleLogin} className="space-y-4">
<div className="flex justify-between items-center">
<h3 className="font-extrabold text-base">Enter Admin or Master PIN</h3>
<button type="button" onClick={() => setIsAdminOpen(false)} className="text-slate-400 font-bold">✕</button>
</div>
<p className="text-xs text-slate-400">Cousin PIN accesses active shop shift controls & menu. Master PIN (9999) accesses absolute developer controls.</p>
<input
type="password"
maxLength="4"
placeholder="Enter 4-digit PIN"
value={enteredPin}
onChange={(e) => setEnteredPin(e.target.value)}
className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-center text-lg tracking-widest text-white"
/>
{authError && <p className="text-xs text-red-400 text-center font-bold">{authError}</p>}
<button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl">Unlock Dashboard</button>
</form>
) : (
<div className="space-y-4">
<div className="flex justify-between items-center border-b border-slate-800 pb-3">
<div>
<h3 className="font-extrabold text-sm">{adminRole === 'master' ? '👑 Master Developer Dashboard' : 🔒${activeShop.name} Admin`}</h3>
<p className="text-[10px] text-slate-400">{adminRole === 'master' ? 'Full access to Supabase & all shops' : 'Manage daily menu & incoming orders'}</p>
</div>
<button onClick={() => { setAdminRole(null); setIsAdminOpen(false); setEnteredPin(''); }} className="text-slate-400 font-bold text-xs bg-slate-800 px-2.5 py-1 rounded-lg">Logout</button>
</div>

{adminRole === 'master' && (
<div className="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-3">
<h4 className="text-xs font-extrabold text-amber-400 uppercase">Supabase Cloud Database Connection</h4>

<div className="space-y-1">
<label className="text-[11px] text-slate-300">Select Shop to Manage</label>
<select
value={currentShopId}
onChange={(e) => setCurrentShopId(e.target.value)}
className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white">
<option value="shop1">Mama's Yard Cookshop</option>
<option value="shop2">Auntie's Ital Corner</option>
</select>
</div>

<div className="space-y-1">
<label className="text-[11px] text-slate-300">SUPABASE PROJECT URL</label>
<input
type="text"
placeholder="https://xxxxxx.supabase.co"
value={activeShop.supabaseUrl}
onChange={(e) => {
const val = e.target.value;
setShops({...shops, [currentShopId]: {...activeShop, supabaseUrl: val}});
}}
className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white font-mono"
/>
</div>

<div className="space-y-1">
<label className="text-[11px] text-slate-300">SUPABASE ANON KEY</label>
<input
type="password"
placeholder="eyJhGciOi..."
value={activeShop.supabaseKey}
onChange={(e) => {
const val = e.target.value;
setShops({...shops, [currentShopId]: {...activeShop, supabaseKey: val}});
}}
className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white font-mono"
/>
</div>

<div className="space-y-1 border-t border-slate-800 pt-2">
<label className="text-[11px] text-slate-300">Shop WhatsApp Number</label>
<input
type="text"
value={activeShop.whatsapp}
onChange={(e) => {
const val = e.target.value;
setShops({...shops, [currentShopId]: {...activeShop, whatsapp: val}});
}}
className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white"
/>
</div>
</div>
)}

<div className="space-y-2">
<h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Incoming Orders Queue ({orders.filter(o => o.shopId === currentShopId).length})</h4>
<div className="max-h-40 overflow-y-auto space-y-2">
{orders.filter(o => o.shopId === currentShopId).length === 0 ? (
<p className="text-xs text-slate-500 text-center py-4">No active orders yet.</p>
) : (
orders.filter(o => o.shopId === currentShopId).map(order => (
<div key={order.id} className="bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs space-y-1">
<div className="flex justify-between font-bold text-emerald-400">
<span>Order #{order.id} ({order.fulfillment})</span>
<span>$`{order.total}</span>
</div>
<p className="text-slate-300">{order.items.map(i => i.name).join(', ')}</p>
{order.deliveryAddress && <p className="text-[10px] text-slate-400">Address: {order.deliveryAddress}</p>}
<button
onClick={() => setOrders(orders.filter(o => o.id !== order.id))}
className="text-[10px] bg-red-950/50 text-red-400 border border-red-900/40 px-2 py-0.5 rounded font-bold">
Clear / Complete Order
</button>
</div>
))
)}
</div>
</div>

<div className="space-y-2 border-t border-slate-800 pt-3">
<h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Shift Controls</h4>

<div className="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800">
<span className="text-xs font-medium">Shop Open Status</span>
<button
onClick={() => setShops({...shops, [currentShopId]: {...activeShop, isOpen: !activeShop.isOpen}})}
className={px-3 py-1 rounded-lg text-xs font-bold${activeShop.isOpen ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`}>
{activeShop.isOpen ? 'OPEN' : 'CLOSED'}
</button>
</div>

<div className="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800">
<span className="text-xs font-medium">Delivery Option</span>
<button
onClick={() => setShops({...shops, [currentShopId]: {...activeShop, deliveryEnabled: !activeShop.deliveryEnabled}})}
className={px-3 py-1 rounded-lg text-xs font-bold ${activeShop.deliveryEnabled ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
{activeShop.deliveryEnabled ? 'ENABLED' : 'DISABLED'}
</button>
</div>

<div className="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800">
<span className="text-xs font-medium">Event Mode Banner</span>
<button
onClick={() => setShops({...shops, [currentShopId]: {...activeShop, eventMode: !activeShop.eventMode}})}
className={px-3 py-1 rounded-lg text-xs font-bold${activeShop.eventMode ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
{activeShop.eventMode ? 'ACTIVE' : 'OFF'}
</button>
</div>
</div>

<div className="space-y-2 border-t border-slate-800 pt-3">
<h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Menu Management & Editing</h4>

<div className="space-y-1.5 max-h-32 overflow-y-auto">
{activeShop.menu.map(item => (
<div key={item.id} className="flex justify-between items-center bg-slate-950 p-2 rounded-lg border border-slate-800 text-xs">
<span className="font-medium truncate max-w-[130px]">{item.name}</span>
<div className="flex items-center gap-1.5">
<button
onClick={() => setEditingDish(item)}
className="px-2 py-1 rounded font-bold text-[10px] bg-slate-800 text-slate-200 hover:bg-slate-700">
Edit
</button>
<button
onClick={() => {
const updatedMenu = activeShop.menu.map(m => m.id === item.id ? {...m, soldOut: !m.soldOut} : m);
setShops({...shops, [currentShopId]: {...activeShop, menu: updatedMenu}});
}}
className={px-2 py-1 rounded font-bold text-[10px] ${item.soldOut ? 'bg-red-950 text-red-400 border border-red-900' : 'bg-emerald-950 text-emerald-400 border border-emerald-900'}`}>
{item.soldOut ? 'Sold Out' : 'In Stock'}
</button>
<button
onClick={() => {
const updatedMenu = activeShop.menu.filter(m => m.id !== item.id);
setShops({...shops, [currentShopId]: {...activeShop, menu: updatedMenu}});
}}
className="text-red-400 font-bold px-1">✕</button>
</div>
</div>
))}
</div>

<div className="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2">
<span className="text-[11px] font-bold text-slate-300">Add New Menu Dish</span>
<input id="newDishName" type="text" placeholder="Dish Name..." className="w-full bg-slate-900 border border-slate-800 rounded p-1.5 text-xs text-white" />
<input id="newDishPrice" type="number" placeholder="Price ($)..." className="w-full bg-slate-900 border border-slate-800 rounded p-1.5 text-xs text-white" /&gt; &lt;button onClick={() =&gt; { const name = document.getElementById('newDishName').value; const price = Number(document.getElementById('newDishPrice').value); if(!name || !price) return; const newItem = { id: Date.now(), name, price, category: "Mains", soldOut: false, desc: "Freshly prepared daily." }; setShops({...shops, [currentShopId]: {...activeShop, menu: [...activeShop.menu, newItem]}}); document.getElementById('newDishName').value = ''; document.getElementById('newDishPrice').value = ''; }} className={w-full ${t.accentBg} text-white font-bold py-1.5 rounded text-xs`}>
+ Add Dish to Menu
</button>
</div>
</div>

</div>
)}
</div>
</div>
)}

</div>
);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
